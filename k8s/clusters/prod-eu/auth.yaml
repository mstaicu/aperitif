apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: auth
spec:
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  path: ./k8s/infra/domain/auth/overlays/prod-eu
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
