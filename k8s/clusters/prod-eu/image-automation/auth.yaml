apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository

metadata:
  name: auth-api
spec:
  image: docker.io/mdstaicu/auth-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy

metadata:
  name: auth-api-latest
spec:
  imageRepositoryRef:
    name: auth-api
  filterTags:
    pattern: "^[a-f0-9]{7}$" # Only short SHAs, 7 hex chars
  policy:
    latest: {}
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation

metadata:
  name: auth
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@tma.com
        name: FluxCD Bot
    push:
      branch: master
  update:
    path: ./k8s/infra/domain/auth/overlays/prod-eu
    strategy: Setters
