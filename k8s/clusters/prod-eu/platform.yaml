apiVersion: v1
kind: Namespace

metadata:
  name: traefik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: v1
kind: Namespace

metadata:
  name: nats
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: v1
kind: Namespace

metadata:
  name: otel
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress-crds
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform/ingress/crds
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform/ingress/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: event-bus
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform/event-bus/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  # The NATS startup probe permits roughly 15 minutes of state recovery.
  timeout: 20m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform/observability/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
