apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: entitlements-api
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/entitlements-api
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: entitlements-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: entitlements-api
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

