apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress-crds
spec:
  interval: 10m
  path: ./k8s/platform/ingress/crds
  prune: true # remove resources no longer in the manifests
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  wait: true
  timeout: 5m # wait ( wait=true ) 5m for resources to become ready

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress
spec:
  interval: 10m
  path: ./k8s/platform/ingress/overlays/live
  prune: true # remove resources no longer in the manifests
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  dependsOn:
    - name: ingress-crds
  wait: true
  timeout: 5m # wait ( wait=true ) 5m for resources to become ready
