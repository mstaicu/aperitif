apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress-crds
spec:
  interval: 10m
  path: ./k8s/platform/ingress/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress
spec:
  interval: 10m
  path: ./k8s/platform/ingress/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-crds
    - name: observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
