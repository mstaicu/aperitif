apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: traefik-crds
spec:
  interval: 10m
  path: ./infra/platform/traefik/crds
  prune: true # remove resources no longer in the manifests
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  wait: true
  timeout: 5m # wait ( wait=true ) 5m for resources to become ready
