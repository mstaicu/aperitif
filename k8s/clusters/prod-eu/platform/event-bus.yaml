apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: event-bus
spec:
  interval: 10m
  path: ./k8s/platform/event-bus/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  # The NATS startup probe permits roughly 15 minutes of state recovery.
  timeout: 20m
