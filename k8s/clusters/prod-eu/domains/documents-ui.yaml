apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: documents-ui
spec:
  interval: 10m
  path: ./k8s/domains/documents/infra/ui/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress
    - name: identity-api
    - name: documents-api
  wait: true
  timeout: 5m
