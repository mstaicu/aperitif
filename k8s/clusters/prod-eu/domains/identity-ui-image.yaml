apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: identity-ui
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/identity-ui
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: identity-ui
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: identity-ui
  filterTags:
    pattern: ^production$
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 1m
