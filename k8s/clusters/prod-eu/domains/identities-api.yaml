apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identities-api
spec:
  interval: 10m
  path: ./k8s/domains/identities/infra/api/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: ingress
    - name: identities-migrate
  wait: true
  timeout: 5m
