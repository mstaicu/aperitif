apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: entitlements-migrations
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/entitlements-migrations
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: entitlements-migrations
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: entitlements-migrations
  filterTags:
    pattern: ^production$
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 1m
