apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: documents-worker
spec:
  interval: 10m
  path: ./k8s/domains/documents/infra/worker/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: event-bus
    - name: accounts-worker
    - name: capabilities-worker
    - name: documents-migrate
  wait: true
  timeout: 5m
