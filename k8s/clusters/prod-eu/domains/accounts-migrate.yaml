apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: accounts-migrate
spec:
  interval: 10m
  path: ./k8s/domains/accounts/infra/migrate/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: accounts-postgres
  force: true
  wait: true
  timeout: 5m # wait ( wait=true ) 5m for resources to become ready
