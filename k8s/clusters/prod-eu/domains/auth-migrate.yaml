apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: auth-migrate
spec:
  interval: 10m
  path: ./k8s/domains/auth/infra/migrate/overlays/live
  force: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: aperitif-repo
  dependsOn:
    - name: auth-db
  wait: true
  timeout: 5m # wait ( wait=true ) 5m for resources to become ready
