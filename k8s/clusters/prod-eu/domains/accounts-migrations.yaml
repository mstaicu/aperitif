apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: accounts-migrations
spec:
  interval: 10m
  path: ./k8s/domains/accounts/components/migrations/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: accounts-postgres
  force: true
  wait: true
  timeout: 5m
