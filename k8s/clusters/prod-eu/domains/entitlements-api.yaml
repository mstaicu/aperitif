apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: entitlements-api
spec:
  interval: 10m
  path: ./k8s/domains/entitlements/infra/api/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: ingress
    - name: observability
    - name: identity-api
    - name: entitlements-migrate
  wait: true
  timeout: 5m
