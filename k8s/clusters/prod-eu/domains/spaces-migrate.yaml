apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: spaces-migrate
spec:
  interval: 10m
  path: ./k8s/domains/spaces/infra/migrate/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: spaces-db
  force: true
  wait: true
  timeout: 5m
