apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: features-worker
spec:
  interval: 10m
  path: ./k8s/domains/features/infra/worker/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: event-bus
    - name: tenancy-worker
    - name: features-migrate
  wait: true
  timeout: 5m
