apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-ui
spec:
  interval: 10m
  path: ./k8s/domains/identity/components/ui/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress
    - name: identity-api
  wait: true
  timeout: 5m
