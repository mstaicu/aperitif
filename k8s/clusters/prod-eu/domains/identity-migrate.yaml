apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-migrate
spec:
  interval: 10m
  path: ./k8s/domains/identity/infra/migrate/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-postgres
  force: true
  wait: true
  timeout: 5m
