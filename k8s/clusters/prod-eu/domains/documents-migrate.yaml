apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: documents-migrate
spec:
  interval: 10m
  path: ./k8s/domains/documents/infra/migrate/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: documents-postgres
  force: true
  wait: true
  timeout: 5m
