apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: accounts-api
spec:
  interval: 10m
  path: ./k8s/domains/accounts/infra/api/overlays/live
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress
    - name: identities-api
    - name: accounts-migrate
  wait: true
  timeout: 5m
