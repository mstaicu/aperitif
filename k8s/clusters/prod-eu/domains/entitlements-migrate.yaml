apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: entitlements-migrate
spec:
  interval: 10m
  path: ./k8s/domains/entitlements/infra/migrate/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: entitlements-postgres
  force: true
  wait: true
  timeout: 5m
