apiVersion: v1
kind: Namespace

metadata:
  name: plans
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: plans-api
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/plans-api
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: plans-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plans-api
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: plans-migrations
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/plans-migrations
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: plans-migrations
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plans-migrations
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: plans-accounts-projection
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/plans-accounts-projection
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: plans-accounts-projection
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: plans-accounts-projection
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: plans-postgres
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/domains/plans/workloads/postgres/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: plans-migrations
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/domains/plans/workloads/migrations/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: plans-postgres
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: plans-api
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/domains/plans/workloads/api/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-crds
    - name: plans-migrations
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: plans-accounts-projection
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/domains/plans/workloads/accounts-projection/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: event-bus
    - name: plans-migrations
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: plans-outbox-relay
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/domains/plans/workloads/outbox-relay/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: event-bus
    - name: plans-migrations
  wait: true
  timeout: 5m
