apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: accounts-api
  namespace: flux-system
spec:
  image: ghcr.io/mstaicu/accounts-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: accounts-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: accounts-api
  filterTags:
    pattern: ^production$
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 1m
