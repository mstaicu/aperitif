apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: mesh-crds

manifests:
  kustomize:
    paths:
      - crds

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: mesh

manifests:
  kustomize:
    paths:
      - overlays/dev

    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}
