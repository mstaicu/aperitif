apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: collector
spec:
  podSelector:
    matchLabels:
      app: collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
