apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik
spec:
  template:
    spec:
      containers:
        - name: traefik
          ports:
            - containerPort: 80
              name: http

          args:
            - --entrypoints.http.address=:80 # Local application traffic and health checks.
            - --entrypoints.http.http.aliasHeadersStrategy=delete # Drop ambiguous header aliases before forwarding.

            - --providers.kubernetesingress=true # Domains publish standard Kubernetes Ingress resources.
            - --providers.kubernetesingress.strictPrefixMatching=true # Use Kubernetes path-element prefix semantics.
            - --providers.file.filename=/etc/traefik/dynamic/dashboard.yaml # Route the dashboard through the same HTTP entrypoint.

            - --api=true # Enable the internal API service used by the dashboard router.

            - --log.level=INFO # Keep local edge logs useful without provider debug noise.
            - --log.format=json # Keep Traefik's own operational logs machine-readable.
            - --accesslog=true # Per-request edge log across all local domains.
            - --accesslog.format=json # Keep access logs machine-readable like application logs.
            - --accesslog.fields.queryparameters.defaultmode=drop # Keep query values out of edge logs.

            - --ping=true # Kubernetes probes ingress health through Traefik itself.
            - --ping.entryPoint=http # Health lives on the plain listener.

            - --metrics.otlp=true # Export ingress metrics to the platform collector.
            - --metrics.otlp.grpc=true # Use OTLP gRPC to the in-cluster collector.
            - --metrics.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT) # Collector service for the whole local stack.
            - --metrics.otlp.grpc.insecure=true # Local collector runs without TLS.

            - --tracing.otlp=true # Emit spans from the shared edge first.
            - --tracing.otlp.grpc=true # Use OTLP gRPC to the in-cluster collector.
            - --tracing.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT) # Collector service for the whole local stack.
            - --tracing.otlp.grpc.insecure=true # Local collector runs without TLS.

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector.otel:4317 # Shared in-cluster OpenTelemetry Collector.

          volumeMounts:
            - name: dashboard
              mountPath: /etc/traefik/dynamic
              readOnly: true

          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10

      volumes:
        - name: dashboard
          configMap:
            name: dashboard
