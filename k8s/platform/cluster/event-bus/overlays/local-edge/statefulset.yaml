apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats
spec:
  template:
    spec:
      containers:
        - name: nats
          volumeMounts:
            - name: nats-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        # Docker Desktop's explicit dynamic host-volume provisioner.
        storageClassName: hostpath
        resources:
          requests:
            storage: 1Gi
