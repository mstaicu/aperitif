apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nats
              topologyKey: kubernetes.io/hostname

      containers:
        - name: nats
          volumeMounts:
            - name: nats-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        # DigitalOcean CSI block storage, also used by the production ingress.
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 1Gi
