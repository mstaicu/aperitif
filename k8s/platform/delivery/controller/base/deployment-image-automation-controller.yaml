apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-automation-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-automation-controller
  template:
    metadata:
      labels:
        app: image-automation-controller
    spec:
      serviceAccountName: image-automation-controller
      containers:
        - name: manager
          image: ghcr.io/fluxcd/image-automation-controller:v1.1.1
          args:
            - --watch-all-namespaces=true
            - --log-level=info
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
