apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: otel-collector
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app: identity-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app: identity-ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: accounts
          podSelector:
            matchLabels:
              app: accounts-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: entitlements
          podSelector:
            matchLabels:
              app: entitlements-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: documents
          podSelector:
            matchLabels:
              app: documents-api
      ports:
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
        - podSelector:
            matchLabels:
              app: otel-agent
      ports:
        - protocol: TCP
          port: 4317
