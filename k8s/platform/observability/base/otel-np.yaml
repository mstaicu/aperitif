apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: default-deny-otel-collector
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-identity-and-accounts-to-otel-http
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app: identity-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: accounts
          podSelector:
            matchLabels:
              app: accounts-api
      ports:
        - protocol: TCP
          port: 4318

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-traefik-to-otel-grpc
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 4317
