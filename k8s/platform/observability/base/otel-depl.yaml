apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  otel-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:

    exporters:
      debug:
        verbosity: basic

    service:
      extensions:
        - health_check

      pipelines:

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug

        logs:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.147.0
          args:
            - --config=/conf/otel-config.yaml

          ports:
            - containerPort: 4318
            - containerPort: 4317
            - name: health
              containerPort: 13133

          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1

          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 1

          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-collector

---
apiVersion: v1
kind: Service

metadata:
  name: otel-srv
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
