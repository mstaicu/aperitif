extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133

receivers:
  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 30s
    endpoint: https://${env:K8S_NODE_NAME}:10250
    insecure_skip_verify: true
    metric_groups:
      - node
      - pod
      - container
      - volume
    metrics:
      # Pod working memory divided by the sum of its container memory limits.
      # This is emitted only when every container in the pod has a memory limit.
      k8s.pod.memory_limit_utilization:
        enabled: true

  file_log:
    include:
      - /var/log/pods/*/*/*.log
    exclude:
      - /var/log/pods/*/otel-agent/*.log
      - /var/log/pods/*/otel-collector/*.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
      # Parse one-line JSON logs while retaining the original JSON body.
      - type: json_parser
        if: 'body matches "^\\{"'
        parse_ints: true
        parse_to: attributes

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  k8sattributes:
    auth_type: serviceAccount
    filter:
      # Each agent watches only pods running on its own node.
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
      # Preserve the original workload when telemetry is forwarded by an agent.
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      # Direct telemetry can fall back to the producer's network connection.
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - k8s.node.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.daemonset.name
        - k8s.statefulset.name
        - k8s.job.name
        - k8s.cronjob.name
        - k8s.container.name
        - container.image.name
        - container.image.tags
  batch:

exporters:
  otlp_grpc:
    endpoint: otel-collector.otel.svc.cluster.local:4317
    tls:
      insecure: true

service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - kubeletstats
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      exporters:
        - otlp_grpc
    logs:
      receivers:
        - file_log
      processors:
        - memory_limiter
        - k8sattributes
        - batch
      exporters:
        - otlp_grpc
