apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  otel-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:

    exporters:
      debug:
        verbosity: basic

    service:
      extensions:
        - health_check

      pipelines:

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug

        logs:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - debug
