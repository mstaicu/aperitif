apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: otel-agent
spec:
  template:
    spec:
      containers:
        - name: otel-agent
          volumeMounts:
            - name: docker-container-logs
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: docker-container-logs
          hostPath:
            path: /var/lib/docker/containers
