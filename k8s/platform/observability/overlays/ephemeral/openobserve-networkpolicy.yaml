apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: openobserve
spec:
  podSelector:
    matchLabels:
      app: openobserve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 5080
