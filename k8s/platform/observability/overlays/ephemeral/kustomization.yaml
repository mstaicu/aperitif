apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: otel

resources:
  - namespace.yaml
  - ../../base
  - openobserve-ingressroute.yaml
  - openobserve-traefik-networkpolicy.yaml

generators:
  - openobserve-ksops-generator.yaml

patches:
  - path: otel-agent-daemonset.yaml
  - path: openobserve-statefulset.yaml
