apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: openobserve-traefik
spec:
  podSelector:
    matchLabels:
      app: openobserve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 5080
