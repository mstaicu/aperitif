server_name: $HOSTNAME

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
  # Server-wide disk ceiling: floor(1 GiB PVC * 80%). The remaining 20% is
  # reserved for filesystem, Raft, consumer-state, and other storage overhead.
  max_file_store: 858993459
}

# Without this, Kubernetes may kill a pod while it’s still leader,
# causing rougher elections and client disconnect pain
lame_duck_duration: 30s
lame_duck_grace_period: 10s

pid_file: "/var/run/nats/nats.pid"

cluster {
  name: "EU"
  port: 6222

  no_advertise: true

  routes = [
    "nats://nats-0.nats-headless.nats.svc.cluster.local:6222",
    "nats://nats-1.nats-headless.nats.svc.cluster.local:6222",
    "nats://nats-2.nats-headless.nats.svc.cluster.local:6222"
  ]
}

# SYS remains authenticated for system operations.
system_account: SYS
# Unauthenticated clients are mapped into the APP account.
no_auth_user: app

accounts: {
  SYS: {
    users: [
      { user: "sys", password: "changeit" }
    ]
  }

  APP: {
    jetstream: {
      # Every product must declare max_bytes on its streams. The platform does
      # not impose one universal stream size because products own retention.
      max_bytes_required: true
    }

    users: [
      { user: "app" }
    ]
  }
}
