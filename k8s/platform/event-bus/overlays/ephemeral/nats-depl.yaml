apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats-depl
spec:
  template:
    spec:
      containers:
        - name: nats
          args:
            - --config
            - /etc/nats-config/nats.conf
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
            - name: nats-storage
              mountPath: /data

      volumes:
        - name: config
          configMap:
            name: nats-config

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        # Docker Desktop's explicit dynamic host-volume provisioner.
        storageClassName: hostpath
        resources:
          requests:
            storage: 1Gi
