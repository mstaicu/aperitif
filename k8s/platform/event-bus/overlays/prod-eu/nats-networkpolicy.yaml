apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: nats
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nats
      ports:
        - port: 6222
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: accounts
          podSelector:
            matchLabels:
              app: outbox-publisher
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: entitlements
          podSelector:
            matchLabels:
              app: outbox-publisher
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: entitlements
          podSelector:
            matchLabels:
              app: accounts-projector
      ports:
        - port: 4222
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: nats
      ports:
        - port: 6222
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
