apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats-depl
spec:
  template:
    spec:
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: nats
          maxSkew: 1
          topologyKey: kubernetes.io/hostname

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nats
              topologyKey: kubernetes.io/hostname

      containers:
        - name: nats
          args:
            - --config
            - /etc/nats-config/nats.conf
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
            - name: nats-storage
              mountPath: /data

      volumes:
        - name: config
          configMap:
            name: nats-config

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
