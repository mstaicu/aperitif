apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: event-bus

manifests:
  kustomize:
    paths:
      - overlays/ephemeral

deploy:
  kubectl: {}

portForward:
  - resourceType: service
    resourceName: nats-client
    namespace: nats
    port: 4222
    localPort: 4222

  - resourceType: service
    resourceName: nats-client
    namespace: nats
    port: 8222
    localPort: 8222
