apiVersion: v1
kind: Service

metadata:
  name: traefik-lb
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: Service

metadata:
  name: traefik-internal
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: http
      port: 80
      targetPort: 80
