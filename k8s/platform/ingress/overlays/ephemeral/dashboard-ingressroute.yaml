apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: dashboard
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`traefik.tma.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      services:
        - kind: TraefikService
          name: api@internal
  tls: {}
