apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik-depl
spec:
  selector:
    matchLabels:
      app: traefik
  replicas: 1
  template:
    spec:
      containers:
        - name: traefik
          args:
            - --entrypoints.http.address=:80
            - --entrypoints.https.address=:443
            - --entrypoints.http.forwardedHeaders.insecure=true
            - --entrypoints.http.transport.respondingTimeouts.readTimeout=10s
            - --entrypoints.http.transport.respondingTimeouts.writeTimeout=10s
            - --entrypoints.http.transport.respondingTimeouts.idleTimeout=15s
            - --entrypoints.https.forwardedHeaders.insecure=true
            - --entrypoints.https.transport.respondingTimeouts.readTimeout=10s
            - --entrypoints.https.transport.respondingTimeouts.writeTimeout=10s
            - --entrypoints.https.transport.respondingTimeouts.idleTimeout=15s
            - --providers.kubernetesgateway=true
            - --log.level=DEBUG
            - --accesslog=true
            - --ping=true
            - --ping.entryPoint=http
            - --api=true
            - --api.dashboard=true

            - --metrics.otlp=true
            - --metrics.otlp.serviceName=traefik
            - --metrics.otlp.grpc=true
            - --metrics.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT)
            - --metrics.otlp.grpc.insecure=true
            - --metrics.otlp.addEntryPointsLabels=false
            - --metrics.otlp.addRoutersLabels=false
            - --metrics.otlp.addServicesLabels=false

            - --tracing.otlp=true
            - --tracing.serviceName=traefik
            - --tracing.otlp.grpc=true
            - --tracing.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT)
            - --tracing.otlp.grpc.insecure=true
            - --tracing.sampleRate=1.0

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-srv.otel.svc.cluster.local:4317
