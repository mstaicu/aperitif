# Traefik entrypoints are the real network listeners opened by the Traefik pod
# (for example http=:80 and https=:443).
#
# Gateway listeners do not create those sockets themselves;
# they bind logical Gateway API traffic surfaces onto the
# existing Traefik entrypoints by matching protocol/port.
#
# HTTPRoutes then attach routing rules to a specific Gateway listener
# via parentRefs/sectionName.
#
# So the layering is:
#   Traefik Deployment -> defines entrypoints
#   Gateway            -> binds listeners to those entrypoints
#   HTTPRoute          -> attaches routes to a specific listener

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass

metadata:
  name: traefik-gwc
spec:
  controllerName: traefik.io/gateway-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: traefik-pgw
spec:
  gatewayClassName: traefik-gwc

  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: tma.com

      allowedRoutes:
        namespaces:
          from: All

      tls:
        mode: Terminate
        certificateRefs:
          - name: traefik-tls

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: traefik-igw
spec:
  gatewayClassName: traefik-gwc

  listeners:
    - name: http
      port: 80
      protocol: HTTP

      allowedRoutes:
        namespaces:
          from: All
