apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  - namespace.yaml
  - ../../base
  - traefik-gateway.yaml
  - traefik-ingress.yaml
  - traefik-lb.yaml
  - traefik-svc.yaml

patches:
  - path: traefik-depl.yaml

generators:
  - traefik-ksops-generator.yaml
