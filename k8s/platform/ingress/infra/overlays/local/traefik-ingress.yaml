apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: traefik-dashboard
spec:
  parentRefs:
    - name: traefik-gw
      sectionName: http

    - name: traefik-gw
      sectionName: https

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api

        - path:
            type: PathPrefix
            value: /dashboard

      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
