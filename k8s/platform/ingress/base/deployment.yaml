apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik
spec:
  selector:
    matchLabels:
      app: traefik
  replicas: 1
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 60
      containers:
        - name: traefik
          image: docker.io/library/traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac

          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https

          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
