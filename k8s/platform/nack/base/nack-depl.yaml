apiVersion: apps/v1
kind: Deployment

metadata:
  name: nack
  labels:
    app: nack
spec:
  selector:
    matchLabels:
      app: nack

  replicas: 1

  template:
    metadata:
      labels:
        app: nack
    spec:
      serviceAccountName: jetstream-controller
      containers:
        - name: jsc
          image: natsio/jetstream-controller:0.22.2
          workingDir: /nack
          command:
            - /jetstream-controller
          args:
            - --crd-connect
            - --control-loop
          volumeMounts:
            - name: runtime
              mountPath: /nack
      volumes:
        - name: runtime
          emptyDir: {}
