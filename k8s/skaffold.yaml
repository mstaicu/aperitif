#
# skaffold run -m ingress-crds
# skaffold run -m ingress
# skaffold run -m event-bus
#
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: platform

requires:
  - path: platform/ingress/skaffold.yaml
  - path: platform/event-bus/skaffold.yaml
  # - path: platform/mesh/skaffold.yaml
  # - path: platform/observability/skaffold.yaml

---
#
# skaffold dev -m app
# skaffold dev -m app -p local
# skaffold dev -m app -p preview
#
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: app

requires:
  - path: domains/auth/skaffold.yaml
