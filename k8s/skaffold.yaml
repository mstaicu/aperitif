# Because this module has no build section,
# we must explicitly define deploy.kubectl or
# Skaffold may render but skip applying when used via `requires`.
#
# skaffold run -m crds
#
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: crds

# Skaffold will run: kustomize build <path>
# and pass output to deploy phase.
manifests:
  kustomize:
    paths:
      - infra/platform/traefik/crds

# REQUIRED for manifest-only modules,
# ensures build output is applied to the cluster
deploy:
  kubectl: {}

---
#
# skaffold run -m infra
#
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: infra

requires:
  - configs: ["crds"]

# Skaffold will run: kustomize build <path>
# and pass output to deploy phase.
manifests:
  kustomize:
    paths:
      - infra/platform/traefik/overlays/dev

    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec
      # Required because ksops (SOPS plugin) is used.
      # Allows Kustomize to execute external plugin binaries.

# REQUIRED for manifest-only modules,
# ensures build output is applied to the cluster
deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: app

requires:
  - configs: ["infra"]

build:
  local:
    push: false
    # Images stay in local Docker daemon.
    # No registry push for local dev.

  artifacts:
    - image: mdstaicu/auth-api
      context: auth-api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: .

manifests:
  kustomize:
    paths:
      - infra/domain/auth/overlays/dev

    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec
      # Needed if ksops is also used in domain layer.

# Explicit deploy step.
# Ensures consistent behavior across modules.
# Not strictly required here (because build exists),
# but recommended for consistency and future-proofing.
deploy:
  kubectl: {}
