apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: entitlements-api-internal
spec:
  entryPoints:
    - http

  routes:
    - kind: Rule
      match: PathPrefix(`/v1/entitlements/docs`) || PathRegexp(`^/v1/accounts/[^/]+/grants(/.*)?$`)
      services:
        - name: entitlements-api
          port: 3000
