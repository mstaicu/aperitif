apiVersion: apps/v1
kind: Deployment

metadata:
  name: entitlements-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: entitlements-api
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@entitlements-postgres:5432/entitlements"
            - name: IDENTITY_JWKS_URL
              value: http://traefik-internal.traefik.svc.cluster.local/.well-known/jwks.json
            - name: OTEL_SERVICE_NAME
              value: entitlements-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
