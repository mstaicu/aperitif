apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: entitlements

resources:
  - ../../base
  - entitlements-api-ingress.yaml

patches:
  - path: entitlements-api-depl.yaml

images:
  - name: ghcr.io/mstaicu/entitlements-api
    newTag: latest # {"$imagepolicy": "flux-system:entitlements-api:tag"}
    digest: "" # {"$imagepolicy": "flux-system:entitlements-api:digest"}
