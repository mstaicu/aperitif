apiVersion: apps/v1
kind: Deployment

metadata:
  name: entitlements-api-depl
spec:
  selector:
    matchLabels:
      app: entitlements-api
  replicas: 3
  template:
    metadata:
      labels:
        app: entitlements-api
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false

      containers:
        - name: entitlements-api
          image: mdstaicu/entitlements-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
