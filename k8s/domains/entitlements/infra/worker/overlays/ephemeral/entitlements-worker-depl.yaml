apiVersion: apps/v1
kind: Deployment

metadata:
  name: entitlements-worker-depl
spec:
  template:
    spec:
      containers:
        - name: entitlements-worker
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres-srv:5432/entitlements"
            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
            - name: NATS_STREAM_REPLICAS
              value: "3"
