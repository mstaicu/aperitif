apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: accounts-api-public
spec:
  hostnames:
    - api.tma.com

  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https-api

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/accounts

      backendRefs:
        - name: accounts-api-srv
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: accounts-api-internal
spec:
  parentRefs:
    - name: traefik-igw
      namespace: traefik
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/accounts

      backendRefs:
        - name: accounts-api-srv
          port: 3000
