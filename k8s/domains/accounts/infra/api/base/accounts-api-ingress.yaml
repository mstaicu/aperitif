apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: accounts-api-public
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && PathPrefix(`/v1/accounts`)
      middlewares:
        - name: accounts-api-public
      services:
        - name: accounts-api-srv
          port: 3000
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: accounts-api-public-docs
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && PathPrefix(`/v1/accounts/docs`)
      middlewares:
        - name: accounts-api-public-docs
      services:
        - name: accounts-api-srv
          port: 3000
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: accounts-api-internal
spec:
  entryPoints:
    - http

  routes:
    - kind: Rule
      match: PathPrefix(`/v1/accounts`)
      services:
        - name: accounts-api-srv
          port: 3000
