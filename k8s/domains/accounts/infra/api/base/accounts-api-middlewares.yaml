apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: false

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-rate-limit
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 200

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-concurrency-limit
spec:
  inFlightReq:
    amount: 100

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 1048576

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public
spec:
  chain:
    middlewares:
      - name: accounts-api-public-security-headers
      - name: accounts-api-public-rate-limit
      - name: accounts-api-public-concurrency-limit
      - name: accounts-api-public-body-limit

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-docs-security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: false

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-docs-rate-limit
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-docs-concurrency-limit
spec:
  inFlightReq:
    amount: 50

---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: accounts-api-public-docs
spec:
  chain:
    middlewares:
      - name: accounts-api-public-docs-security-headers
      - name: accounts-api-public-docs-rate-limit
      - name: accounts-api-public-docs-concurrency-limit
