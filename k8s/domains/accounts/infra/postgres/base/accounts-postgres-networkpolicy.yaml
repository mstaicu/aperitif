apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-accounts-components-to-postgres
spec:
  podSelector:
    matchLabels:
      app: accounts-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: accounts-api
        - podSelector:
            matchLabels:
              app: accounts-migrations
        - podSelector:
            matchLabels:
              app: outbox
      ports:
        - protocol: TCP
          port: 5432
