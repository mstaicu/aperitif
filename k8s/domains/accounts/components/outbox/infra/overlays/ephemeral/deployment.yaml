apiVersion: apps/v1
kind: Deployment

metadata:
  name: outbox
spec:
  template:
    spec:
      containers:
        - name: outbox
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/accounts"
            - name: NATS_URL
              value: nats://nats-client.nats.svc.cluster.local:4222
            - name: NATS_STREAM_MAX_BYTES
              value: "419430400" # 400 MiB; product-owned stream capacity.
            - name: NATS_STREAM_REPLICAS
              value: "3"
