apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: accounts-api-public
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && PathPrefix(`/v1/accounts`)
      services:
        - name: accounts-api-srv
          port: 3000
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: accounts-api-public-docs
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && PathPrefix(`/v1/accounts/docs`)
      services:
        - name: accounts-api-srv
          port: 3000
  tls: {}
