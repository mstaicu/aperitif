apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-postgres

manifests:
  kustomize:
    paths:
      - infra/postgres/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-migrations

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-migrations
      context: components/migrations
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - components/migrations/infra/overlays/ephemeral
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-api

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-api
      context: components/api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - components/api/infra/overlays/ephemeral
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-outbox

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-outbox
      context: components/outbox
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - components/outbox/infra/overlays/ephemeral
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}
