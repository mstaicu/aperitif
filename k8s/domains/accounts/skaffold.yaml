apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-db-dev

manifests:
  kustomize:
    paths:
      - infra/db/overlays/dev

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-migrate-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/accounts-migrate
      context: migrations
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - infra/migrate/overlays/dev

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-api-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/accounts-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - infra/api/overlays/dev
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: accounts-worker-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/accounts-worker
      context: worker
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - infra/worker/overlays/dev

deploy:
  kubectl: {}
