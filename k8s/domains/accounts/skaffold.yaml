apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: accounts-postgres

manifests:
  kustomize:
    paths:
      - deploy/postgres/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: accounts-migrations

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-migrations
      context: migrations
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - deploy/migrations/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: accounts-api

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - deploy/api/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: accounts-outbox

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/accounts-outbox
      context: outbox
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - deploy/outbox/overlays/ephemeral

deploy:
  kubectl: {}
