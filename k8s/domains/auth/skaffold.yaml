apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: auth

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/auth-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: .

profiles:
  - name: local

    manifests:
      kustomize:
        paths:
          - infra/overlays/local
        buildArgs:
          - --enable-alpha-plugins
          - --enable-exec

    deploy:
      kubectl: {}

  - name: preview

    manifests:
      kustomize:
        paths:
          - infra/overlays/preview
        buildArgs:
          - --enable-alpha-plugins
          - --enable-exec

    deploy:
      kubectl: {}

    portForward:
      - resourceType: service
        resourceName: auth-api-srv
        namespace: auth
        port: 3000
        localPort: 4300
