apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: auth-local

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/auth-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: .

manifests:
  kustomize:
    paths:
      - infra/env/local
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: auth-preview

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/auth-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: .

manifests:
  kustomize:
    paths:
      - infra/env/preview
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

portForward:
  - resourceType: service
    resourceName: auth-api-srv
    port: 3000
    localPort: 4300
