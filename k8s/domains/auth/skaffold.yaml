apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-postgres

manifests:
  kustomize:
    paths:
      - deploy/postgres/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-migrations

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/auth-migrations
      context: migrations
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - deploy/migrations/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-api

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/auth-api
      context: api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - deploy/api/overlays/ephemeral
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-ui

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/auth-ui
      context: ui
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - deploy/ui/overlays/ephemeral

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-cleanup

manifests:
  kustomize:
    paths:
      - deploy/cleanup/overlays/ephemeral

deploy:
  kubectl: {}
