apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: auth-ui

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/auth-ui
      context: .
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - infra/overlays/local-edge

deploy:
  kubectl: {}

profiles:
  - name: local-direct
    manifests:
      kustomize:
        paths:
          - infra/overlays/local-direct
    portForward:
      - resourceType: service
        resourceName: ui
        namespace: auth
        port: 3000
        localPort: 3000
