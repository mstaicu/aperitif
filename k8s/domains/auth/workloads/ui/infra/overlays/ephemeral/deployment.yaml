apiVersion: apps/v1
kind: Deployment

metadata:
  name: ui
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ui
          env:
            - name: API_INTERNAL_V1_URL
              value: http://api.auth.svc.cluster.local:3000/v1
            - name: NODE_OPTIONS
              value: "--experimental-loader=@opentelemetry/instrumentation/hook.mjs --import ./src/otel.ts"
            - name: OTEL_SERVICE_NAME
              value: auth-ui
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
