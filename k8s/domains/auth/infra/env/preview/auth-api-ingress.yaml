apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: auth-api-public
spec:
  # hostnames:
  #   - tma.com
  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: auth-api-srv
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: auth-jwks-public
spec:
  # hostnames:
  #   - tma.com
  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https

  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/jwks.json

      backendRefs:
        - name: auth-api-srv
          port: 3000

---
