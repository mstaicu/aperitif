apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth

resources:
  - ../../base

secretGenerator:
  - name: auth-migrate-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/auth?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: mdstaicu/auth-migrate
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:auth-migrate-latest
    newTag: latest # {"$imagepolicy": "flux-system:auth-migrate-latest"}
