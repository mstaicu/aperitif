apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-worker-depl
spec:
  selector:
    matchLabels:
      app: auth-worker
  replicas: 1
  template:
    metadata:
      labels:
        app: auth-worker
    spec:
      serviceAccountName: auth-worker
      # Defense in deep, disable this at the pod level to prevent overwrites at the
      # service account level
      automountServiceAccountToken: false
      containers:
        - name: auth-worker
          image: mdstaicu/auth-worker
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-worker-cm
                  key: DATABASE_URL

            # Clients will learn the cluster topology, use the ClientIP hostname
            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: auth-worker-nats-secrets
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-worker-nats-secrets
                  key: password

          securityContext:
            runAsNonRoot: true
            # This will override the Docker image USER
            # if you get this right, there will be issues
            # uncommenting this to let the Dockerfile decide the USER
            # runAsUser: 10001
            allowPrivilegeEscalation: false

            # Node sometimes writes to:
            #   /tmp
            #   $HOME
            #   npm cache
            # If your app ever crashes with:
            #   EROFS: read-only file system
            # You need to mount writable tmp.

            # volumeMounts:
            #   - name: tmp
            #     mountPath: /tmp
            # volumes:
            #   - name: tmp
            #     emptyDir: {}

            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
