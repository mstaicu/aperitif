apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: api-public-jwks
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && Path(`/.well-known/jwks.json`)
      services:
        - name: api
          port: 3000
  tls:
    certResolver: le
    domains:
      - main: api.tma.com
