apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: features

resources:
  - namespace.yaml
  - ../../base
  - features-worker-db.yaml

patches:
  - path: features-worker-depl.yaml

images:
  - name: mdstaicu/features-worker
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:features-worker-latest
    newTag: latest # {"$imagepolicy": "flux-system:features-worker-latest"}
