apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-features-units-to-postgres
spec:
  podSelector:
    matchLabels:
      app: features-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: features-api
        - podSelector:
            matchLabels:
              app: features-migrate
        - podSelector:
            matchLabels:
              app: features-worker
      ports:
        - protocol: TCP
          port: 5432
