apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: features

resources:
  - namespace.yaml
  - ../../base
  - features-api-db.yaml

patches:
  - path: features-api-depl.yaml

images:
  - name: mdstaicu/features-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:features-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:features-api-latest"}
