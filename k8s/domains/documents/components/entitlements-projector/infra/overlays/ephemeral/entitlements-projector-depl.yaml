apiVersion: apps/v1
kind: Deployment

metadata:
  name: entitlements-projector
spec:
  template:
    spec:
      containers:
        - name: entitlements-projector
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres-srv:5432/documents"
            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
