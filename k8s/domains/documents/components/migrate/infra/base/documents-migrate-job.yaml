apiVersion: batch/v1
kind: Job

metadata:
  name: migrate
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: documents-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never

      containers:
        - name: migrate
          image: mdstaicu/documents-migrate

          env:
            - name: FLYWAY_LOCATIONS
              value: filesystem:/db/sql
            - name: FLYWAY_FAIL_ON_MISSING_LOCATIONS
              value: "true"
