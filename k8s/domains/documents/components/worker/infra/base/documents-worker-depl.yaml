apiVersion: apps/v1
kind: Deployment

metadata:
  name: documents-worker-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documents-worker
  template:
    metadata:
      labels:
        app: documents-worker
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false

      containers:
        - name: documents-worker
          image: mdstaicu/documents-worker
          ports:
            - name: health
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 2
