---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: documents-ui

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/documents-ui
      context: components/ui
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: app/**/*
            dest: /home/node/app
          - src: server.ts
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - components/ui/infra/overlays/ephemeral

deploy:
  kubectl: {}
