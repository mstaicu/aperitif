apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: documents-api-public
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && PathPrefix(`/v1/documents`)
      middlewares:
        - name: documents-api-public
      services:
        - name: documents-api-srv
          port: 3000
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: documents-api-internal
spec:
  entryPoints:
    - http

  routes:
    - kind: Rule
      match: PathPrefix(`/v1/documents`)
      services:
        - name: documents-api-srv
          port: 3000
