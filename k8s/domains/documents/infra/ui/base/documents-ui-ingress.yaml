apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: documents-ui-public
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`tma.com`) && Path(`/documents`)
      middlewares:
        - name: documents-ui-public
      services:
        - name: documents-ui-srv
          port: 3000
  tls: {}
