apiVersion: apps/v1
kind: Deployment

metadata:
  name: documents-postgres-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documents-postgres
  template:
    metadata:
      labels:
        app: documents-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: documents-postgres
          image: docker.io/postgres:18
          env:
            - name: POSTGRES_DB
              value: documents
            - name: POSTGRES_PASSWORD
              value: postgres

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d documents
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d documents
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: postgres-srv
spec:
  type: ClusterIP
  selector:
    app: documents-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
