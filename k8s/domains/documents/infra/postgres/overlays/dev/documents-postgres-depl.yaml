apiVersion: apps/v1
kind: Deployment

metadata:
  name: documents-postgres-depl
spec:
  template:
    spec:
      containers:
        - name: documents-postgres
          env:
            - name: POSTGRES_PASSWORD
              value: postgres

          volumeMounts:
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/001-documents-init.sql
              subPath: documents-postgres-init.sql
              readOnly: true

      volumes:
        - name: postgres-init
          configMap:
            name: documents-postgres-init
