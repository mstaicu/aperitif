apiVersion: apps/v1
kind: Deployment

metadata:
  name: documents-worker-depl
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: documents-worker
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres-srv:5432/documents"
            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
