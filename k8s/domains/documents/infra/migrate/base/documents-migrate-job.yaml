apiVersion: batch/v1
kind: Job

metadata:
  name: migrate
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: documents-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never

      containers:
        - name: migrate
          image: mdstaicu/documents-migrate
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://postgres-srv:5432/documents?user=postgres&password=postgres"
            - name: FLYWAY_LOCATIONS
              value: filesystem:/db/migrations
            - name: FLYWAY_FAIL_ON_MISSING_LOCATIONS
              value: "true"
