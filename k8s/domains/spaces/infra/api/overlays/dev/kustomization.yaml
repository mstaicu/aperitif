apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spaces

resources:
  - ../../base

patches:
  - path: spaces-api-depl.yaml

secretGenerator:
  - name: spaces-api-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/spaces?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true
