apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spaces

resources:
  - ../../base

secretGenerator:
  - name: spaces-migrate-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/spaces?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: mdstaicu/spaces-migrate
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:spaces-migrate-latest
    newTag: latest # {"$imagepolicy": "flux-system:spaces-migrate-latest"}
