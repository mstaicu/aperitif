apiVersion: apps/v1
kind: Deployment

metadata:
  name: tenancy-worker-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenancy-worker
  template:
    metadata:
      labels:
        app: tenancy-worker
    spec:
      terminationGracePeriodSeconds: 15
      serviceAccountName: tenancy-worker
      # Defense in deep, disable this at the pod level
      # to prevent overwrites at the service account level
      automountServiceAccountToken: false

      containers:
        - name: tenancy-worker
          image: mdstaicu/tenancy-worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tenancy-worker-db
                  key: DATABASE_URL

            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
