apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: default-deny-tenancy-worker
spec:
  podSelector:
    matchLabels:
      app: tenancy-worker
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-tenancy-worker-dns
spec:
  podSelector:
    matchLabels:
      app: tenancy-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-tenancy-worker-to-postgres
spec:
  podSelector:
    matchLabels:
      app: tenancy-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tenancy-postgres
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-tenancy-worker-to-nats
spec:
  podSelector:
    matchLabels:
      app: tenancy-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
          podSelector:
            matchLabels:
              app: nats
      ports:
        - protocol: TCP
          port: 4222
