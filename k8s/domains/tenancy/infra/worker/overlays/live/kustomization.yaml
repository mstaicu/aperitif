apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenancy

resources:
  - ../../base

patches:
  - path: tenancy-worker-depl.yaml

secretGenerator:
  - name: tenancy-worker-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/tenancy?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: mdstaicu/tenancy-worker
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:tenancy-worker-latest
    newTag: latest # {"$imagepolicy": "flux-system:tenancy-worker-latest"}
