apiVersion: apps/v1
kind: Deployment

metadata:
  name: tenancy-postgres-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenancy-postgres
  template:
    metadata:
      labels:
        app: tenancy-postgres
    spec:
      containers:
        - name: tenancy-postgres
          image: docker.io/postgres:18
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_DB
              value: tenancy

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d tenancy
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d tenancy
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: postgres-srv
spec:
  type: ClusterIP
  selector:
    app: tenancy-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
