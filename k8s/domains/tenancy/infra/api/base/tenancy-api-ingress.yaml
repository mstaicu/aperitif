apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: tenancy-api-public
spec:
  entryPoints:
    - https

  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && (PathPrefix(`/v1/tenancy/docs`) || PathPrefix(`/v1/tenants`))
      services:
        - name: tenancy-api-srv
          port: 3000
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: tenancy-api-internal
spec:
  entryPoints:
    - http

  routes:
    - kind: Rule
      match: PathPrefix(`/v1/tenancy/docs`) || PathPrefix(`/v1/tenants`)
      services:
        - name: tenancy-api-srv
          port: 3000
