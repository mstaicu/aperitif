apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: tenancy-api-public
spec:
  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tenancy

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: tenancy-api-srv
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: tenancy-api-internal
spec:
  parentRefs:
    - name: traefik-igw
      namespace: traefik
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tenancy

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: tenancy-api-srv
          port: 3000
