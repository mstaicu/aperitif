apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenancy

resources:
  - namespace.yaml
  - ../../base
  - tenancy-api-db.yaml

patches:
  - path: tenancy-api-depl.yaml

images:
  - name: mdstaicu/tenancy-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:tenancy-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:tenancy-api-latest"}
