apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: identity-ui-public
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`tma.com`) && (PathPrefix(`/login`) || PathPrefix(`/signup`) || PathPrefix(`/identity/assets`))
      services:
        - name: identity-ui-srv
          port: 3000
  tls:
    certResolver: le
    domains:
      - main: tma.com
