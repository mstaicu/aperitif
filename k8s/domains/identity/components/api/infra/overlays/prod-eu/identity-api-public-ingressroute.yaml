apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: identity-api-public
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`api.tma.com`) && (PathPrefix(`/v1/passkeys`) || PathPrefix(`/v1/sessions`))
      services:
        - name: identity-api
          port: 3000
  tls:
    certResolver: le
    domains:
      - main: api.tma.com
