apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: identity-api-public
spec:
  hostnames:
    - api.tma.com

  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https-api

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/identity/docs
        - path:
            type: PathPrefix
            value: /v1/passkeys
        - path:
            type: PathPrefix
            value: /v1/sessions

      backendRefs:
        - name: identity-api-srv
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: identity-jwks-public
spec:
  hostnames:
    - api.tma.com

  parentRefs:
    - name: traefik-pgw
      namespace: traefik
      sectionName: https-api

  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/jwks.json

      backendRefs:
        - name: identity-api-srv
          port: 3000

