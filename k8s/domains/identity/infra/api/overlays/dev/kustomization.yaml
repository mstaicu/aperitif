apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../base

generators:
  - identity-ksops-generator.yaml

patches:
  - path: identity-api-depl.yaml

configMapGenerator:
  - name: identity-api-cm
    literals:
      - ORIGIN=https://tma.com
      - JWT_AUDIENCE=aperitif-api

secretGenerator:
  - name: identity-api-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/identity?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true
