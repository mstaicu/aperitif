apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - namespace.yaml
  - ../../base
  - identity-api-jwt.yaml
  - identity-api-db.yaml

patches:
  - path: identity-api-depl.yaml

configMapGenerator:
  - name: identity-api-cm
    literals:
      - ORIGIN=https://tma.com
      - ACCESS_TOKEN_AUDIENCE=aperitif-api
      - PLATFORM_OPERATOR_USER_IDS=9eaef281-ad2c-4382-8c47-7208a66f2ed4

images:
  - name: mdstaicu/identity-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:identity-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:identity-api-latest"}
