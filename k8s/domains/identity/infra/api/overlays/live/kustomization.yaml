apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../base
  - identity-api-jwt.yaml

configMapGenerator:
  - name: identity-api-cm
    literals:
      - ORIGIN=https://tma.com
      - JWT_AUDIENCE=aperitif-api

secretGenerator:
  - name: identity-api-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/identity?sslmode=disable
    options:
      disableNameSuffixHash: true

images:
  - name: mdstaicu/identity-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:identity-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:identity-api-latest"}
