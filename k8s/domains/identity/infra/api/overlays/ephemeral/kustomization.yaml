apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - namespace.yaml
  - ../../base
  - identity-api-ingress.yaml

generators:
  - identity-api-ksops-generator.yaml

patches:
  - path: identity-api-depl.yaml

configMapGenerator:
  - name: identity-api-cm
    literals:
      - ORIGIN=https://tma.com

generatorOptions:
  disableNameSuffixHash: true
