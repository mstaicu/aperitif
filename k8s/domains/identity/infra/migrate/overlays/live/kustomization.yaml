apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../base

secretGenerator:
  - name: identity-migrate-db
    literals:
      - FLYWAY_URL=jdbc:postgresql://postgres-srv:5432/identity?sslmode=disable
      - FLYWAY_USER=postgres
      - FLYWAY_LOCATIONS=filesystem:/db/migrations,filesystem:/db/repeatable

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: mdstaicu/identity-migrate
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:identity-migrate-latest
    newTag: latest # {"$imagepolicy": "flux-system:identity-migrate-latest"}
