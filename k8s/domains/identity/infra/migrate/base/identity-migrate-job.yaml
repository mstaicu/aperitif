apiVersion: batch/v1
kind: Job

metadata:
  name: migrate
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: identity-migrate
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: mdstaicu/identity-migrate

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-migrate-db
                  key: DATABASE_URL
