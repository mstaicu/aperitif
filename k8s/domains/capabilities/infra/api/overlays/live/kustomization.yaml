apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: capabilities

resources:
  - namespace.yaml
  - ../../base
  - capabilities-api-db.yaml

patches:
  - path: capabilities-api-depl.yaml

images:
  - name: mdstaicu/capabilities-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:capabilities-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:capabilities-api-latest"}
