apiVersion: batch/v1
kind: Job

metadata:
  name: migrate
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: capabilities-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never

      containers:
        - name: migrate
          image: mdstaicu/capabilities-migrate

          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: capabilities-migrate-db
                  key: FLYWAY_URL
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: capabilities-migrate-db
                  key: FLYWAY_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: capabilities-migrate-db
                  key: FLYWAY_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: filesystem:/db/migrations
            - name: FLYWAY_FAIL_ON_MISSING_LOCATIONS
              value: "true"
