apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: capabilities

resources:
  - namespace.yaml
  - ../../base
  - capabilities-worker-db.yaml

patches:
  - path: capabilities-worker-depl.yaml

images:
  - name: mdstaicu/capabilities-worker
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:capabilities-worker-latest
    newTag: latest # {"$imagepolicy": "flux-system:capabilities-worker-latest"}
