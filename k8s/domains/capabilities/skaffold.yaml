apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: capabilities-postgres-dev

manifests:
  kustomize:
    paths:
      - infra/postgres/overlays/dev

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: capabilities-migrate-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/capabilities-migrate
      context: packages/database
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - infra/migrate/overlays/dev
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: capabilities-api-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/capabilities-api
      context: packages/api
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - infra/api/overlays/dev
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}

---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: capabilities-worker-dev

build:
  local:
    push: false

  artifacts:
    - image: mdstaicu/capabilities-worker
      context: packages/worker
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - infra/worker/overlays/dev
    buildArgs:
      - --enable-alpha-plugins
      - --enable-exec

deploy:
  kubectl: {}
