apiVersion: apps/v1
kind: Deployment

metadata:
  name: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false

      containers:
        - name: relay
          image: ghcr.io/mstaicu/relay
          ports:
            - name: health
              containerPort: 3000

          volumeMounts:
            - name: streams
              mountPath: /etc/relay
              readOnly: true

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 2

      volumes:
        - name: streams
          configMap:
            name: relay-streams
