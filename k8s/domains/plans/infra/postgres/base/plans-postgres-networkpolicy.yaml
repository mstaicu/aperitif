apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-plans-components-to-postgres
spec:
  podSelector:
    matchLabels:
      app: plans-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: plans-api
        - podSelector:
            matchLabels:
              app: plans-migrations
        - podSelector:
            matchLabels:
              app: outbox
        - podSelector:
            matchLabels:
              app: accounts-projection
      ports:
        - protocol: TCP
          port: 5432
