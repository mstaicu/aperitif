apiVersion: apps/v1
kind: Deployment

metadata:
  name: accounts-projection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-projection
  template:
    metadata:
      labels:
        app: accounts-projection
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false

      containers:
        - name: accounts-projection
          image: ghcr.io/mstaicu/plans-accounts-projection
          ports:
            - name: health
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 2
