apiVersion: apps/v1
kind: Deployment

metadata:
  name: outbox
spec:
  template:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: outbox
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/plans"
            - name: NATS_URL
              value: nats://nats-client.nats.svc.cluster.local:4222
            - name: NATS_STREAM_MAX_AGE_NANOS
              value: "604800000000000" # 7 days in ns; automatic replay window.
            - name: NATS_STREAM_MAX_BYTES
              value: "419430400" # 400 MiB; half the 800 MiB server budget.
            - name: NATS_STREAM_REPLICAS
              value: "3" # One full copy on each of 3 NATS pods.
            - name: OTEL_SERVICE_NAME
              value: plans-outbox
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
