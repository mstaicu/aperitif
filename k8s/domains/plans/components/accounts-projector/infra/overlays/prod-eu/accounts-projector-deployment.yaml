apiVersion: apps/v1
kind: Deployment

metadata:
  name: accounts-projector
spec:
  template:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: accounts-projector
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@plans-postgres:5432/plans"
            - name: NATS_URL
              value: nats://nats-client.nats.svc.cluster.local:4222
