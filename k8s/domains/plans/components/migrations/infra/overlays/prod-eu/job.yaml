apiVersion: batch/v1
kind: Job

metadata:
  name: migrations
spec:
  template:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrations
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://plans-postgres:5432/plans?user=postgres&password=postgres"
