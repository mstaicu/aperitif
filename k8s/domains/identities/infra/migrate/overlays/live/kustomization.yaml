apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identities

resources:
  - ../../base

secretGenerator:
  - name: identities-migrate-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/identities?sslmode=disable

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: mdstaicu/identities-migrate
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:identities-migrate-latest
    newTag: latest # {"$imagepolicy": "flux-system:identities-migrate-latest"}
