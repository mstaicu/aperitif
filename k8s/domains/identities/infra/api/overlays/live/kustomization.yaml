apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identities

resources:
  - ../../base
  - identities-api-jwt.yaml

configMapGenerator:
  - name: identities-api-cm
    literals:
      - ORIGIN=https://tma.com
      - JWT_ALLOWED_AUDIENCES=spaces

secretGenerator:
  - name: identities-api-db
    literals:
      - DATABASE_URL=postgres://postgres@postgres-srv:5432/identities?sslmode=disable
    options:
      disableNameSuffixHash: true

images:
  - name: mdstaicu/identities-api
    # This field is managed by this ImagePolicy: <namespace>:<imagepolicy-name>
    # meaning: flux-system:identities-api-latest
    newTag: latest # {"$imagepolicy": "flux-system:identities-api-latest"}
