version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /domains/*/workloads/*
      - /platform/runtime/*
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /domains/*/workloads/*
      - /platform/runtime/*
    schedule:
      interval: weekly
