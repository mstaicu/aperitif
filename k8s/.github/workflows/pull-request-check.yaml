name: pull request check

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: pull-request-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: find changed units
    runs-on: ubuntu-24.04
    outputs:
      domains: ${{ steps.domains.outputs.all_changed_and_modified_files }}
      runtimes: ${{ steps.runtimes.outputs.all_changed_and_modified_files }}

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - id: domains
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: domains/**
          dir_names: true
          dir_names_max_depth: 2
          matrix: true

      - id: runtimes
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: platform/runtime/*/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

  check:
    name: check ${{ matrix.path }}
    needs: changes
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.domains) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 26

      - uses: azure/setup-kubectl@v4.0.1

      - name: check
        run: make -C "${{ matrix.path }}" check

  check-runtime:
    name: check ${{ matrix.path }}
    needs: changes
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.runtimes) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 26

      - name: check
        run: make -C "${{ matrix.path }}" check
