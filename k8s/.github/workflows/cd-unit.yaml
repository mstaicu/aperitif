name: CD / Unit

on:
  workflow_call:
    inputs:
      build_context:
        required: true
        type: string
      domain:
        required: true
        type: string
      image:
        required: true
        type: string
      overlay:
        required: true
        type: string
      unit:
        required: true
        type: string

concurrency:
  group: cd-${{ inputs.domain }}-${{ inputs.unit }}
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          target: prod
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}

  promote:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    concurrency:
      group: cd-manifest-write
      queue: max

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2.1.0

      - name: update image digest
        working-directory: ${{ inputs.overlay }}
        run: kustomize edit set image "${{ inputs.image }}=${{ inputs.image }}@${{ needs.publish.outputs.digest }}"

      - name: commit production manifest
        shell: bash
        run: |
          manifest="${{ inputs.overlay }}/kustomization.yaml"

          git add "$manifest"
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${{ inputs.domain }} ${{ inputs.unit }} ${GITHUB_SHA::12}"
          git pull --rebase origin master
          git push origin HEAD:master
