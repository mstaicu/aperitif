name: deployment / capabilities / api

on:
  push:
    branches:
      - master
    paths:
      - "domains/capabilities/packages/api/**"

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deployment.yaml
    with:
      context: domains/capabilities/packages/api
      domain: capabilities
      image: mdstaicu/capabilities-api
      manifest: domains/capabilities/infra/api/overlays/live
      unit: api
    secrets: inherit
