name: Release

on:
  push:
    branches: [master]
    paths:
      - "domains/*/components/*/**"
      - "!domains/*/components/*/infra/**"

permissions:
  contents: read

jobs:
  changes:
    name: Find changed components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.changes.outputs.all_changed_and_modified_files }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: domains/*/components/*/**
          files_ignore: domains/*/components/*/infra/**
          dir_names: true
          dir_names_max_depth: 4
          matrix: true

  publish:
    name: Publish ${{ matrix.component }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-${{ matrix.component }}
      queue: max
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - uses: actions/checkout@v6

      - name: Read image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          manifest="$COMPONENT/infra/overlays/prod-eu/kustomization.yaml"
          if [ -f "$manifest" ]; then
            echo "name=$(yq -r '.images[0].name' "$manifest")" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.name != ''
        uses: docker/setup-buildx-action@v4

      - if: steps.image.outputs.name != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        if: steps.image.outputs.name != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:production
