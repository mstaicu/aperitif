name: Release

on:
  push:
    branches: [master]
    paths:
      - "domains/*/components/*/**"
      - "!domains/*/components/*/infra/**"

permissions:
  contents: read

jobs:
  changes:
    name: Find changed components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.changes.outputs.all_changed_and_modified_files }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: domains/*/components/*/**
          files_ignore: domains/*/components/*/infra/**
          dir_names: true
          dir_names_max_depth: 4
          matrix: true

  publish:
    name: Publish ${{ matrix.component }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - uses: actions/checkout@v6

      - name: Read image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          manifest="$COMPONENT/infra/overlays/prod-eu/kustomization.yaml"
          if [ -f "$manifest" ]; then
            echo "name=$(yq -r '.images[0].name' "$manifest")" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.name != ''
        uses: docker/setup-buildx-action@v4

      - if: steps.image.outputs.name != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        if: steps.image.outputs.name != ''
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Record result
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir release
          printf '%s' "$COMPONENT" > release/component
          printf '%s' "$DIGEST" > release/digest

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ strategy.job-index }}
          path: release
          retention-days: 1

  update:
    name: Update production manifests
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: releases

      - name: Update image digests
        run: |
          for release in releases/*; do
            component="$(<"$release/component")"
            digest="$(<"$release/digest")"

            if [ -n "$digest" ]; then
              manifest="$component/infra/overlays/prod-eu/kustomization.yaml"
              DIGEST="$digest" yq -i \
                '.images[0] |= (.digest = strenv(DIGEST) | del(.newTag))' \
                "$manifest"
            fi
          done

      - name: Commit production manifests
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains/*/components/*/infra/overlays/prod-eu/kustomization.yaml
          git commit -m "Release ${GITHUB_SHA::12}"
          git pull --rebase origin master
          git push origin HEAD:master
