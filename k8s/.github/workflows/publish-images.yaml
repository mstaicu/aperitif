name: publish images

on:
  push:
    branches: [master]
    paths:
      - "domains/*/workloads/*/**"
      - "platform/runtime/*/**"
      - "!domains/*/workloads/*/infra/**"

concurrency:
  group: publish-images
  queue: max

permissions:
  contents: read

jobs:
  workloads:
    name: find changed workloads
    runs-on: ubuntu-24.04
    outputs:
      # Flatten the domain and runtime lists into one publishing matrix.
      workloads: >-
        ${{ toJSON(fromJSON(format('[{0},{1}]',
          steps.domains.outputs.all_changed_and_modified_files,
          steps.runtimes.outputs.all_changed_and_modified_files
        )).*.*) }}

    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - id: domains
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: domains/*/workloads/*/**
          files_ignore: domains/*/workloads/*/infra/**
          dir_names: true
          dir_names_max_depth: 4
          matrix: true

      - id: runtimes
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: platform/runtime/*/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

  publish:
    name: publish ${{ matrix.workload }}
    needs: workloads
    if: needs.workloads.outputs.workloads != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.workloads.outputs.workloads) }}

    steps:
      - uses: actions/checkout@v6.1.0

      - id: image
        name: read build-unit image
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          image=$(yq -r '.build.artifacts[0].image // ""' "$WORKLOAD/skaffold.yaml")
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: build and publish image
        uses: docker/build-push-action@v7.3.0
        if: steps.image.outputs.name != ''
        with:
          context: ${{ matrix.workload }}
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: scan image
        uses: aquasecurity/trivy-action@v0.36.0
        if: steps.image.outputs.name != ''
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: promote image to 'latest'
        if: steps.image.outputs.name != ''
        run: >
          docker buildx imagetools create
          --tag "${{ steps.image.outputs.name }}:latest"
          "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
