name: deployment / tenancy / worker

on:
  push:
    branches:
      - master
    paths:
      - "domains/tenancy/packages/worker/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deployment-master
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2.1.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: domains/tenancy/packages/worker
          target: prod
          push: true
          tags: mdstaicu/tenancy-worker:${{ hashFiles('domains/tenancy/packages/worker/**') }}

      - name: update manifest
        working-directory: domains/tenancy/infra/worker/overlays/live
        run: kustomize edit set image "mdstaicu/tenancy-worker=mdstaicu/tenancy-worker@${{ steps.build.outputs.digest }}"

      - name: commit manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="domains/tenancy/infra/worker/overlays/live/kustomization.yaml"

          if git diff --quiet -- "$manifest"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "Deploy tenancy worker ${GITHUB_SHA::12}"
          git push
