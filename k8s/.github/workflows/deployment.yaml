name: deployment / unit

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      domain:
        required: true
        type: string
      image:
        required: true
        type: string
      manifest:
        required: true
        type: string
      unit:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true

# Let the running release finish. If more revisions arrive for the same unit,
# GitHub keeps the newest pending run and replaces only obsolete pending runs.
concurrency:
  group: deployment-${{ inputs.domain }}-${{ inputs.unit }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # Build exactly the source revision that triggered the caller workflow.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: check build context
        run: test -d "${{ inputs.context }}"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          target: prod
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}

  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    # Every unit may build independently, but only one job may mutate the Git
    # desired state at a time. queue:max keeps up to 100 promotions waiting.
    concurrency:
      group: deployment-manifest-write
      queue: max

    steps:
      # Promotion intentionally starts from the latest desired state. The image
      # itself was already built from the immutable triggering revision above.
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2.1.0

      - name: check production overlay
        run: test -f "${{ inputs.manifest }}/kustomization.yaml"

      - name: update manifest
        working-directory: ${{ inputs.manifest }}
        run: kustomize edit set image "${{ inputs.image }}=${{ inputs.image }}@${{ needs.build.outputs.digest }}"

      - name: commit manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="${{ inputs.manifest }}/kustomization.yaml"

          if git diff --quiet -- "$manifest"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "Deploy ${{ inputs.domain }} ${{ inputs.unit }} ${GITHUB_SHA::12}"
          git pull --rebase origin master
          git push origin HEAD:master
