name: post-merge

on:
  push:
    branches: [master]
    paths:
      - "domains/*/components/*/**"
      - "!domains/*/components/*/infra/**"

concurrency:
  group: post-merge
  queue: max

permissions:
  contents: read

jobs:
  changes:
    name: find changed components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.changes.outputs.all_changed_and_modified_files }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: domains/*/components/*/**
          files_ignore: domains/*/components/*/infra/**
          dir_names: true
          dir_names_max_depth: 4
          matrix: true

  publish:
    name: publish ${{ matrix.component }}
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: image
        name: read image name
        run: echo "name=$(yq -r '.images[0].name' '${{ matrix.component }}/infra/overlays/prod-eu/kustomization.yaml')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.component }}
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
