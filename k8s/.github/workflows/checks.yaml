name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: pull-request-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Find changes
    runs-on: ubuntu-24.04
    outputs:
      paths: ${{ steps.changes.outputs.all_changed_and_modified_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - id: changes
        name: Find domain and runtime changes
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            domains/**
            platform/runtime/**
          dir_names: true
          dir_names_max_depth: 2
          output_renamed_files_as_deleted_and_added: true
          fail_on_initial_diff_error: true
          matrix: true

  check:
    name: Check · ${{ matrix.path }}
    needs: changes
    if: needs.changes.outputs.paths != '[]'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.paths) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26

      - name: Run checks
        env:
          UNIT: ${{ matrix.path }}
        run: make -C "$UNIT" check
