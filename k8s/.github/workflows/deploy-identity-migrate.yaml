name: deployment / identity / migrate

on:
  push:
    branches:
      - master
    paths:
      - "domains/identity/packages/database/Dockerfile"
      - "domains/identity/packages/database/.dockerignore"
      - "domains/identity/packages/database/sql/**"

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deployment.yaml
    with:
      context: domains/identity/packages/database
      domain: identity
      image: mdstaicu/identity-migrate
      manifest: domains/identity/infra/migrate/overlays/prod-eu
      unit: migrate
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
