name: CD / Identity / UI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "domains/identity/packages/ui/**"

permissions:
  contents: write
  packages: write

jobs:
  cd:
    uses: ./.github/workflows/cd-unit.yaml
    with:
      build_context: domains/identity/packages/ui
      domain: identity
      image: ghcr.io/mstaicu/identity-ui
      overlay: domains/identity/infra/ui/overlays/prod-eu
      unit: ui
