name: Pull Request

on:
  pull_request:

jobs:
  domain-smoke:
    name: ${{ matrix.domain }} smoke
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        domain:
          - identities
          - accounts

    defaults:
      run:
        shell: bash
        working-directory: k8s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aperitif-pr

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          curl -fsSL -o skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

          curl -fsSL -o mkcert https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert

          curl -fsSL -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar -xzf age.tar.gz
          sudo mv age/age age/age-keygen /usr/local/bin/

          curl -fsSL -o sops https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

          curl -fsSL -o ksops.tar.gz https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.3.3/ksops_4.3.3_Linux_x86_64.tar.gz
          tar -xzf ksops.tar.gz
          sudo mv ksops /usr/local/bin/ksops

      - name: Configure SOPS age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          test -n "$SOPS_AGE_KEY"
          mkdir -p "$HOME/.config/sops/age"
          printf '%s\n' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 600 "$HOME/.config/sops/age/keys.txt"
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - name: Deploy domain
        run: make ${{ matrix.domain }}

      - name: Expose ingress
        run: |
          kubectl rollout status -n traefik deploy/traefik-depl --timeout=300s
          kubectl -n traefik port-forward svc/traefik-lb 8443:443 > /tmp/traefik-port-forward.log 2>&1 &
          echo $! > /tmp/traefik-port-forward.pid
          timeout 30 bash -c 'until : > /dev/tcp/127.0.0.1/8443; do sleep 1; done'

      - name: Smoke domain
        run: |
          curl -kfsS --resolve tma.com:8443:127.0.0.1 https://tma.com:8443/.well-known/jwks.json

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/traefik-port-forward.pid ]; then
            kill "$(cat /tmp/traefik-port-forward.pid)" || true
          fi

          kind delete cluster --name aperitif-pr
