name: deployment / capabilities

on:
  push:
    branches:
      - master
    paths:
      - "domains/capabilities/packages/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deployment-master
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2.1.0
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: domains/capabilities/packages/migrate
          target: prod
          push: true
          tags: mdstaicu/capabilities-migrate:${{ hashFiles('domains/capabilities/packages/migrate/**') }}

      - name: update migrate manifest
        working-directory: domains/capabilities/infra/migrate/overlays/live
        run: kustomize edit set image "mdstaicu/capabilities-migrate=mdstaicu/capabilities-migrate@${{ steps.build-migrate.outputs.digest }}"

      - id: build-api
        uses: docker/build-push-action@v6
        with:
          context: domains/capabilities/packages/api
          target: prod
          push: true
          tags: mdstaicu/capabilities-api:${{ hashFiles('domains/capabilities/packages/api/**') }}

      - name: update api manifest
        working-directory: domains/capabilities/infra/api/overlays/live
        run: kustomize edit set image "mdstaicu/capabilities-api=mdstaicu/capabilities-api@${{ steps.build-api.outputs.digest }}"

      - id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: domains/capabilities/packages/worker
          target: prod
          push: true
          tags: mdstaicu/capabilities-worker:${{ hashFiles('domains/capabilities/packages/worker/**') }}

      - name: update worker manifest
        working-directory: domains/capabilities/infra/worker/overlays/live
        run: kustomize edit set image "mdstaicu/capabilities-worker=mdstaicu/capabilities-worker@${{ steps.build-worker.outputs.digest }}"

      - name: commit manifests
        shell: bash
        run: |
          set -euo pipefail

          manifests=(
            domains/capabilities/infra/migrate/overlays/live/kustomization.yaml
            domains/capabilities/infra/api/overlays/live/kustomization.yaml
            domains/capabilities/infra/worker/overlays/live/kustomization.yaml
          )

          if git diff --quiet -- "${manifests[@]}"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${manifests[@]}"
          git commit -m "Deploy capabilities ${GITHUB_SHA::12}"
          git push
