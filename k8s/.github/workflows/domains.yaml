on:
  pull_request:
    paths:
      - "domains/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  integration:
    runs-on: ubuntu-latest

    concurrency:
      group: pull-request-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    env:
      CLUSTER_NAME: domains-${{ github.event.pull_request.number }}
      DOMAIN: tma.com
      KSOPS_VERSION: 4.5.1
      MKCERT_VERSION: v1.4.4
      SKAFFOLD_VERSION: v2.17.0
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SOPS_VERSION: v3.12.2

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: select domains
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const domains = [...new Set(
              files
                .map((file) => file.filename.match(/^domains\/([^/]+)\//)?.[1])
                .filter(Boolean)
            )].sort();

            if (domains.length === 0) {
              core.setFailed("No domain changes found.");
              return;
            }

            core.exportVariable("CHANGED_DOMAINS", domains.join(" "));

      - name: check domain targets
        run: |
          for domain in $CHANGED_DOMAINS; do
            make -n "$domain" >/dev/null
          done

      - name: check sops age key
        if: env.SOPS_AGE_KEY == ''
        run: |
          echo "::error::SOPS_AGE_KEY repository secret is required for encrypted dev overlays."
          exit 1

      - name: create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          wait: 120s

      - name: setup kubectl
        uses: azure/setup-kubectl@v4.0.1

      - name: setup kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          curl -fsSL \
            -o skaffold \
            "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64"
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

          curl -fsSL \
            -o mkcert \
            "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert

          curl -fsSL \
            -o sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

          curl -fsSL \
            -o ksops.tar.gz \
            "https://github.com/viaduct-ai/kustomize-sops/releases/download/v${KSOPS_VERSION}/ksops_${KSOPS_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf ksops.tar.gz
          sudo mv ksops /usr/local/bin/ksops

      - name: configure skaffold
        run: |
          skaffold config set --kube-context "kind-${CLUSTER_NAME}" local-cluster true

      - name: deploy domain
        run: |
          for domain in $CHANGED_DOMAINS; do
            make "$domain"
          done

      - name: expose ingress
        run: |
          kubectl -n traefik port-forward svc/traefik-lb 8443:443 > /tmp/traefik-port-forward.log 2>&1 &
          echo "$!" > /tmp/traefik-port-forward.pid
          timeout 30 bash -c 'until : > /dev/tcp/127.0.0.1/8443; do sleep 1; done'

      - name: smoke domains
        run: |
          for domain in $CHANGED_DOMAINS; do
            case "$domain" in
              identities)
                smoke_path="/.well-known/jwks.json"
                smoke_status="200"
                ;;
              accounts)
                smoke_path="/accounts"
                smoke_status="401"
                ;;
              *)
                echo "::error::No smoke check configured for domain: ${domain}"
                exit 1
                ;;
            esac

            status="$(curl \
              -ksS \
              -o /tmp/domain-smoke-response.txt \
              -w "%{http_code}" \
              --resolve "${DOMAIN}:8443:127.0.0.1" \
              "https://${DOMAIN}:8443${smoke_path}")"

            if [ "$status" != "$smoke_status" ]; then
              echo "Expected ${domain} HTTP ${smoke_status}, got HTTP ${status}"
              cat /tmp/domain-smoke-response.txt
              exit 1
            fi
          done

      - name: cleanup
        if: always()
        run: |
          set +e

          if [ -f /tmp/traefik-port-forward.pid ]; then
            kill "$(cat /tmp/traefik-port-forward.pid)"
          fi

          kind delete cluster --name "$CLUSTER_NAME"
