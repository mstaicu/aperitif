on:
  pull_request:
    paths:
      - "domains/*/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  integration:
    runs-on: ubuntu-latest

    concurrency:
      group: pull-request-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    env:
      CLUSTER_NAME: domains-${{ github.event.pull_request.number }}
      DOMAIN: tma.com
      KSOPS_VERSION: 4.5.1
      MKCERT_VERSION: v1.4.4
      SKAFFOLD_VERSION: v2.17.0
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SOPS_VERSION: v3.12.2

    steps:
      - uses: actions/checkout@v6

      # Scope this job to changed domain deployable units. The Make dry-run is
      # the structural guard for new domains: a domain folder needs a matching
      # deploy target before CI can evaluate it.
      - name: select domains
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const domains = [...new Set(
              files
                .map((file) => file.filename.match(/^domains\/([^/]+)\//)?.[1])
                .filter(Boolean),
            )].sort();

            if (domains.length === 0) {
              core.setFailed("No changed domain deploy target selected.");
              return;
            }

            for (const domain of domains) {
              execFileSync("make", ["-n", domain], { stdio: "ignore" });
            }

            core.exportVariable("CHANGED_DOMAINS", domains.join(" "));

      # CI uses the same encrypted dev overlays as local integration checks.
      - name: check sops age key
        if: env.SOPS_AGE_KEY == ''
        run: |
          echo "::error::SOPS_AGE_KEY repository secret is required for encrypted dev overlays."
          exit 1

      - name: create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          wait: 120s

      - name: setup kubectl
        uses: azure/setup-kubectl@v4.0.1

      - name: setup kustomize
        uses: imranismail/setup-kustomize@v2.1.0

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

          curl -fsSL -o skaffold "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64"
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/skaffold

          curl -fsSL -o mkcert "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/mkcert

          curl -fsSL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

          curl -fsSL -o ksops.tar.gz "https://github.com/viaduct-ai/kustomize-sops/releases/download/v${KSOPS_VERSION}/ksops_${KSOPS_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf ksops.tar.gz
          sudo mv ksops /usr/local/bin/ksops

      - name: configure skaffold
        run: |
          kubectl config use-context "kind-${CLUSTER_NAME}"
          skaffold config set --kube-context "kind-${CLUSTER_NAME}" local-cluster true

      # Future phase, still scoped to $CHANGED_DOMAINS:
      # - run fast domain-local checks such as typecheck, lint, and focused domain tests;
      # - validate OpenAPI and event schema compatibility;
      # - empty-DB migration is already covered by make <domain>; later validate
      #   migrations against a previous schema/data snapshot for upgrade safety.
      #
      # Keep these checks inside the owning domain. Do not turn this into a
      # cross-domain product test suite.

      # Current required proof: each changed domain can deploy through the same
      # Make/Skaffold path developers use locally.
      - name: deploy domains
        run: |
          for domain in $CHANGED_DOMAINS; do
            make "$domain"
          done

      # Hit the real Gateway/Traefik path from the runner instead of calling
      # services directly inside the cluster.
      - name: expose ingress
        run: |
          kubectl -n traefik port-forward svc/traefik-lb 8443:443 > /tmp/traefik-port-forward.log 2>&1 &
          echo "$!" > /tmp/traefik-port-forward.pid
          timeout 30 bash -c 'until : > /dev/tcp/127.0.0.1/8443; do sleep 1; done'

      # Keep PR smoke checks tiny and stable: prove route ownership, startup,
      # auth boundary behavior, and the public contract endpoint for each domain.
      # Add one case per new domain when its Make target is added.
      - name: smoke domains
        run: |
          for domain in $CHANGED_DOMAINS; do
            case "$domain" in
              identity)
                curl -fkSs -o /dev/null --resolve "${DOMAIN}:8443:127.0.0.1" "https://${DOMAIN}:8443/login"
                curl -fkSs -o /dev/null --resolve "api.${DOMAIN}:8443:127.0.0.1" "https://api.${DOMAIN}:8443/.well-known/jwks.json"
                curl -fkSs -o /dev/null --resolve "api.${DOMAIN}:8443:127.0.0.1" "https://api.${DOMAIN}:8443/v1/identity/docs/json"
                ;;
              accounts)
                curl -fkSs -o /dev/null --resolve "api.${DOMAIN}:8443:127.0.0.1" "https://api.${DOMAIN}:8443/v1/accounts/docs/json"
                [[ "$(curl -ksS -o /dev/null -w "%{http_code}" --resolve "api.${DOMAIN}:8443:127.0.0.1" "https://api.${DOMAIN}:8443/v1/accounts")" = "401" ]]
                ;;
            esac
          done

      - name: cleanup
        if: always()
        run: |
          if [ -f /tmp/traefik-port-forward.pid ]; then
            kill "$(cat /tmp/traefik-port-forward.pid)" || true
          fi

          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name "$CLUSTER_NAME" || true
          fi
