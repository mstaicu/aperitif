name: CD / Accounts / Migrate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "domains/accounts/packages/database/Dockerfile"
      - "domains/accounts/packages/database/.dockerignore"
      - "domains/accounts/packages/database/sql/**"

permissions:
  contents: write
  packages: write

jobs:
  cd:
    uses: ./.github/workflows/cd-unit.yaml
    with:
      build_context: domains/accounts/packages/database
      domain: accounts
      image: ghcr.io/mstaicu/accounts-migrate
      overlay: domains/accounts/infra/migrate/overlays/prod-eu
      unit: migrate
