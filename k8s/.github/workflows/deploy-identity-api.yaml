name: deployment / identity / api

on:
  push:
    branches:
      - master
    paths:
      - "domains/identity/packages/api/**"
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deployment-master
      cancel-in-progress: false

    env:
      IMAGE: mdstaicu/identity-api
      CONTEXT: domains/identity/packages/api
      OVERLAY: domains/identity/infra/api/overlays/live

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v2.1.0
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          target: prod
          push: true
          tags: ${{ env.IMAGE }}:${{ hashFiles('domains/identity/packages/api/**') }}

      - name: update manifest
        working-directory: ${{ env.OVERLAY }}
        run: |
          kustomize edit set image "$IMAGE=$IMAGE@${{ steps.build.outputs.digest }}"

      - name: commit manifest
        run: |
          set -euo pipefail

          if git diff --quiet -- "$OVERLAY/kustomization.yaml"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY/kustomization.yaml"
          git commit -m "Deploy identity-api ${GITHUB_SHA::12}"
          git push
