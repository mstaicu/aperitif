name: publish image

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ inputs.source }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ${{ format('ghcr.io/mstaicu/{0}', replace(replace(replace(inputs.source, 'domains/', ''), 'platform/runtime/', ''), '/workloads/', '-')) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.source }}
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: promote image to 'latest'
        run: >
          docker buildx imagetools create
          --tag "${{ env.IMAGE }}:latest"
          "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
