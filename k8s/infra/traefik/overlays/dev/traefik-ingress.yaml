apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: traefik-http-dash
spec:
  entryPoints:
    - http
  routes:
    - match: Host(`tma.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      kind: Rule

      services:
        - name: api@internal
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: traefik-https-dash
spec:
  entryPoints:
    - https
  routes:
    - match: Host(`tma.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      kind: Rule

      services:
        - name: api@internal
          kind: TraefikService
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: TLSOption

metadata:
  name: tls-options
spec:
  minVersion: VersionTLS12
  sniStrict: true
