apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-worker-depl
spec:
  selector:
    matchLabels:
      app: auth-worker
  replicas: 3
  template:
    metadata:
      labels:
        app: auth-worker
    spec:
      containers:
        - name: auth-worker
          image: mdstaicu/auth-worker
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONGO_DB_URI
              valueFrom:
                configMapKeyRef:
                  name: auth-worker-cm
                  key: MONGO_DB_URI
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: auth-worker-cm
                  key: ORIGIN
