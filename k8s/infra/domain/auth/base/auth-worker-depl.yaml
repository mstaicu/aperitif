apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-worker-depl
spec:
  selector:
    matchLabels:
      app: auth-worker
  replicas: 3
  template:
    metadata:
      labels:
        app: auth-worker
    spec:
      containers:
        - name: auth-worker
          image: mdstaicu/auth-worker
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-api-cm
                  key: DATABASE_URL
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: auth-worker-cm
                  key: ORIGIN

            - name: NATS_URL
              value: nats://nats-headless.nats.svc.cluster.local:4222
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: auth-worker-nats-secrets
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-worker-nats-secrets
                  key: password
