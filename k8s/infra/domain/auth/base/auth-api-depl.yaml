apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-api-depl
spec:
  selector:
    matchLabels:
      app: auth-api
  replicas: 3
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      serviceAccountName: auth-api
      # Defense in deep, disable this at the pod level to prevent overwrites at the
      # service account level
      automountServiceAccountToken: false
      containers:
        - name: auth-api
          image: mdstaicu/auth-api
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-api-cm
                  key: DATABASE_URL
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: auth-api-cm
                  key: ORIGIN

            - name: JWT_PRIVATE_KEY_PATH
              value: /app/keys/jwt-private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/jwt-public.pem

            # Clients will learn the cluster topology, use the ClientIP hostname
            - name: NATS_URL
              value: nats://nats-srv.nats.svc.cluster.local:4222
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: auth-api-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-api-nats-creds
                  key: password

          securityContext:
            runAsNonRoot: true
            # This will override the Docker image USER
            # if you get this right, there will be issues
            # uncommenting this to let the Dockerfile decide the USER
            runAsUser: 1000
            runAsGroup: 1000

            allowPrivilegeEscalation: false

            # Node sometimes writes to:
            #   /tmp
            #   $HOME
            #   npm cache
            # If your app ever crashes with:
            #   EROFS: read-only file system
            # You need to mount writable tmp.

            # volumeMounts:
            #   - name: tmp
            #     mountPath: /tmp
            # volumes:
            #   - name: tmp
            #     emptyDir: {}

            # readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: auth-api-jwt
              mountPath: /app/keys
              readOnly: true

          #
          # total probe time =
          #     initialDelay + timeout + ( (periodSeconds + timeout) * (failureThreshold - 1) )
          #
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2

      volumes:
        - name: auth-api-jwt
          secret:
            secretName: auth-api-jwt
