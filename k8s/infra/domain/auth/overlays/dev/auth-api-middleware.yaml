# # ------------------------------------------------------------
# # 1) Strip spoofable identity headers (MUST be first)
# # ------------------------------------------------------------
# apiVersion: traefik.io/v1alpha1
# kind: Middleware

# metadata:
#   name: platform-strip-identity-headers
# spec:
#   headers:
#     customRequestHeaders:
#       # Strip anything a client could try to spoof
#       X-User-Id: ""
#       X-Scope: ""
#       X-Aud: ""
#       X-Auth-Iss: ""
#       X-Auth-Exp: ""
#       # Optional: if you want services to never see JWT
#       Authorization: ""

# ---
# # ------------------------------------------------------------
# # 2) JWT validation + claim-to-header injection (runs AFTER strip)
# #
# # Notes:
# # - Required: true => requests without JWT get rejected (401/403 depending on plugin)
# # - Audiences/Issuers enforce coarse domain gating.
# # - JwtHeaders injects claims into headers *after validation*.
# # - PayloadFields must include any claims you want to extract.
# # ------------------------------------------------------------
# apiVersion: traefik.io/v1alpha1
# kind: Middleware

# metadata:
#   name: auth-jwt
# spec:
#   plugin:
#     jwt:
#       Required: true
#       Keys:
#         - http://auth-api-srv.auth.svc.cluster.local:3000/.well-known/jwks.json
#       Alg: ES256
#       ForceRefreshKeys: true

#       Issuers:
#         - https://tma.com
#       Audiences:
#         - ai

#       # Claims we want to extract
#       PayloadFields:
#         - sub
#         - aud
#         - iss
#         - exp
#         - scope

#       # Map claims → headers visible to the service
#       JwtHeaders:
#         X-User-Id: sub
#         X-Aud: aud
#         X-Auth-Iss: iss
#         X-Auth-Exp: exp
#         X-Scope: scope

#       # Only accept Bearer token from Authorization header
#       JwtSources:
#         - type: bearer
#           key: Authorization

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
spec:
  rateLimit:
    # ------------------------------------------------------------
    # Rate limit sizing memory (DO NOT DELETE)
    #
    # safe_concurrency =
    #   ((max_connections - other_system_usage) * auth_budget) * safety_factor
    #
    # Example:
    # max_connections = 100
    # other_usage = 20
    # auth_budget = 0.75
    # safety_factor = 0.6
    #
    # safe_concurrency = ((100 - 20) * 0.75) * 0.6
    #                  = 36 concurrent auth requests (cluster-wide)
    #
    # Throughput estimate:
    #
    # p95_latency = 80ms = 0.08s
    #
    # max_rps ≈ safe_concurrency / p95
    #        ≈ 36 / 0.08
    #        ≈ 450 rps cluster capacity
    #
    # Per-IP shaping assumption:
    #
    # assumed_active_ips = 500
    #
    # per_ip_rps ≈ 450 / 500
    #            ≈ 0.9 rps
    #
    # per_ip_per_minute ≈ 0.9 * 60 ≈ 54
    #
    # Therefore bootstrap config:
    # average ≈ 50/min
    # burst   ≈ 2x average
    #
    # IMPORTANT:
    # These are GUESS NUMBERS until real metrics exist.
    # Tune after observing:
    # - real p95
    # - real concurrency
    # - real IP distribution
    # ------------------------------------------------------------
    average: 50
    burst: 100
    period: 1m

    sourceCriterion:
      ipStrategy:
        depth: 1

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-inflight
spec:
  inFlightReq:
    # ------------------------------------------------------------
    # Bootstrap concurrency guard
    #
    # Using safe_concurrency ≈ 36 → rounded up to 40
    #
    # This protects:
    # - DB connection pool
    # - WebAuthn verification CPU
    # - downstream signing / token issuance
    #
    # Tune when real metrics exist.
    # ------------------------------------------------------------
    amount: 40

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-body-limit
spec:
  buffering:
    # WebAuthn payloads are small but can include attestation blobs.
    # 64 KiB is a safe ceiling.
    maxRequestBodyBytes: 65536

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: auth-api-timeouts
spec:
  forwardingTimeouts:
    dialTimeout: 2s
    responseHeaderTimeout: 5s
    idleConnTimeout: 15s


# timeout = f(p99_latency, failure_budget, user_patience)
# concurrency = f(database_capacity, safety_factor)
# rate_limit = f(concurrency, fairness_model)

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /auth
