apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: auth-api-jwt
spec:
  plugin:
    jwt:
      Required: false
      Keys:
        - http://auth-api-srv.auth.svc.cluster.local:3000/.well-known/jwks.json # Cluster-internal JWKS
      Alg: ES256
      PayloadFields:
        - exp
        - sub
        - aud
        - iss
      Audiences:
        - tma.com
      Issuers:
        - https://tma.com
      ForceRefreshKeys: true
      JwtSources:
        - type: bearer
          key: Authorization
      JwtHeaders:
        X-User-Id: sub
---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: auth-api-strip-headers
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: auth-inflight
spec:
  inFlightReq:
    # safe_concurrency = ((max_conn - other connections) * budget) * safe_budget
    # safe_concurrency = ((100 - 20) * 0.75) * 0.6 = 36 (cluster-wide)

    # With 1 Traefik replica, inFlight per pod = 36 / 1 = 36

    # Throughput estimate:
    # p95 = 80ms = 80 / 1000ms (1s) = 0.08
    # 36 / 0.08 = 450 rps
    # 450 * 60 * 60 * 24 * 30 ≈ 1.16B requests/month
    amount: 36
---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: auth-ratelimit
spec:
  rateLimit:
    # safe_concurrency = ((max_conn - other connections) * budget) * safe_budget
    # average_per_minute ≈ (safe_concurrency / p95) / assumed_IPs * 60
    # average_per_minute = 36 / 0.08 / 500 * 60
    # burst = average_per_minute * 2
    average: 50
    burst: 100
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: auth-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 65536
