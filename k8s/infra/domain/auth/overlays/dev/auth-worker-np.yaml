---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-auth-worker-egress-to-nats
spec:
  podSelector:
    matchLabels:
      app: auth-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-auth-worker-to-mongo
spec:
  podSelector:
    matchLabels:
      app: auth-api-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-worker
      ports:
        - protocol: TCP
          port: 27017
