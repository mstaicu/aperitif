        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Path(`/auth/webauthn/authentication/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-body-limit
        - name: auth-inflight
      services:
        - name: auth-api-srv
