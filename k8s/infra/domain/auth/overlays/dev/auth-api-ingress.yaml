apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api-external
spec:
  entryPoints:
    - https
  routes:
    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/registration/challenge`) &&
        Method(`POST`)
      kind: Rule
      #
      # middlewares execute in the order you attach them to the route
      # rateLimit runs first
      # If allowed → request proceeds
      # Then inFlight checks concurrency
      # If concurrency slot available → request forwarded to service
      #
      middlewares:
        - name: auth-body-limit
        - name: auth-ratelimit
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/registration`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-body-limit
        - name: auth-ratelimit
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/authentication/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-body-limit
        - name: auth-ratelimit
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/authentication`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-body-limit
        - name: auth-ratelimit
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

  tls: {}
---
