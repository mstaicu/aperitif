apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api-public

spec:
  entryPoints:
    - https

  routes:
    - match: Host(`tma.com`) && PathPrefix(`/auth/v1`)
      kind: Rule

      middlewares:
        - name: auth-strip-prefix
        - name: auth-ratelimit
        - name: auth-inflight
        - name: auth-body-limit

      services:
        - name: auth-api-srv
          port: 3000
          serversTransport: auth-api-timeouts

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-docs
spec:
  entryPoints:
    - https

  routes:
    - match: Host(`tma.com`) && PathPrefix(`/auth/docs`)
      kind: Rule

      # middlewares:
      #   - name: auth-strip-prefix

      services:
        - name: auth-api-srv
          port: 3000

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api-internal

spec:
  entryPoints:
    - http

  routes:
    - match: PathPrefix(`/auth/v1`)
      kind: Rule

      middlewares:
        - name: auth-strip-prefix
        - name: auth-inflight
        - name: auth-body-limit

      services:
        - name: auth-api-srv
          port: 3000
          serversTransport: auth-api-timeouts

