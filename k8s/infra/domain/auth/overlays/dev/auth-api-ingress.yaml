apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api-external
spec:
  entryPoints:
    - https
  routes:
    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/registration/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
        - name: auth-ratelimit
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/registration`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
        - name: auth-ratelimit
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/authentication/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
        - name: auth-ratelimit
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`api.tma.com`) &&
        Path(`/auth/webauthn/authentication`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
        - name: auth-ratelimit
      services:
        - name: auth-api-srv
          port: 3000

  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api-internal
spec:
  entryPoints:
    - http-auth
  routes:
    - match: Path(`/auth/webauthn/registration/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Path(`/auth/webauthn/registration`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Path(`/auth/webauthn/authentication/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000

    - match: Path(`/auth/webauthn/authentication`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-inflight
      services:
        - name: auth-api-srv
          port: 3000
