apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-api
spec:
  entryPoints:
    - https
  routes:
    # Registration Challenge
    - match: Host(`tma.com`) && Path(`/api/v1/auth/webauthn/registration/challenge`)
      kind: Rule
      middlewares:
        - name: auth-ratelimit-reg-challenge
        - name: auth-api-strip-prefix
      services:
        - name: auth-api-srv
          port: 3000

    # Registration Finalize
    - match: Host(`tma.com`) && Path(`/api/v1/auth/webauthn/registration`)
      kind: Rule
      middlewares:
        - name: auth-ratelimit-reg-finalize
        - name: auth-api-strip-prefix
      services:
        - name: auth-api-srv
          port: 3000

    # Authentication Challenge
    - match: Host(`tma.com`) && Path(`/api/v1/auth/webauthn/authentication/challenge`)
      kind: Rule
      middlewares:
        - name: auth-ratelimit-auth-challenge
        - name: auth-api-strip-prefix
      services:
        - name: auth-api-srv
          port: 3000

    # Authentication Finalize
    - match: Host(`tma.com`) && Path(`/api/v1/auth/webauthn/authentication`)
      kind: Rule
      middlewares:
        - name: auth-ratelimit-auth-finalize
        - name: auth-api-strip-prefix
      services:
        - name: auth-api-srv
          port: 3000

  tls: {}
