apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: auth-api
spec:
  entryPoints:
    - https
  routes:
    - match: Host(`tma.com`) &&
        Path(`/api/v1/auth/webauthn/registration/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-api-strip-headers
        - name: auth-api-strip-prefix
        - name: auth-ratelimit-challenge
        - name: auth-inflight-challenge
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`tma.com`) &&
        Path(`/api/v1/auth/webauthn/registration`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-api-strip-headers
        - name: auth-api-strip-prefix
        - name: auth-ratelimit-reg-finalize
        - name: auth-inflight-finalize
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`tma.com`) &&
        Path(`/api/v1/auth/webauthn/authentication/challenge`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-api-strip-headers
        - name: auth-api-strip-prefix
        - name: auth-ratelimit-challenge
        - name: auth-inflight-challenge
      services:
        - name: auth-api-srv
          port: 3000

    - match: Host(`tma.com`) &&
        Path(`/api/v1/auth/webauthn/authentication`) &&
        Method(`POST`)
      kind: Rule
      middlewares:
        - name: auth-api-strip-headers
        - name: auth-api-strip-prefix
        - name: auth-ratelimit-auth-finalize
        - name: auth-inflight-finalize
      services:
        - name: auth-api-srv
          port: 3000

  tls:
    certResolver: letsencrypt
