apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nats

resources:
  - ../../base
  - nats-ns.yaml
  - nats-pdb.yaml
  - nats-secrets.yaml

configMapGenerator:
  - name: nats-config
    files:
      - nats.conf=nats.conf

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: nats-depl.yaml
