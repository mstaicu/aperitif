apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats-depl
spec:
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          args:
            - --config
            - /etc/nats-config/nats.conf
          envFrom:
            - secretRef:
                name: nats-secrets
          volumeMounts:
            - name: nats-storage
              mountPath: /data
            - name: config
              mountPath: /etc/nats-config

      volumes:
        - name: config
          configMap:
            name: nats-config

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        storageClassName: hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
