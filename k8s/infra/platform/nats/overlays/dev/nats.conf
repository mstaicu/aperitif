server_name: $HOSTNAME

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

cluster {
  name: "EU"
  port: 6222
  routes = ["nats://nats-headless.nats.svc.cluster.local:4222"]
}

authorization {
  default_permissions = {
    publish = []
    subscribe = []
  }

  users = [
    {
      user: "auth-api"
      password: ${AUTH_API_PASSWORD}
      permissions = {
        publish = ["auth.>", "$JS.API.>"]
        subscribe = ["auth.>", "$JS.API.>"]
      }
    },
    {
      user: "auth-worker"
      password: ${AUTH_WORKER_PASSWORD}
      permissions = {
        publish = ["auth.>", "$JS.API.>"]
        subscribe = ["auth.>", "$JS.API.>"]
      }
    }
  ]
}