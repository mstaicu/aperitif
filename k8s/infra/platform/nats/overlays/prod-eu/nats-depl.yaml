apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats-depl
spec:
  template:
    metadata:
      labels:
        app: nats
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - nats
              topologyKey: kubernetes.io/hostname

      containers:
        - name: nats
          args:
            - --config
            - /etc/nats-config/nats.conf
          volumeMounts:
            - mountPath: /etc/nats-config
              name: config

      volumes:
        - name: config
          configMap:
            name: nats-config
