apiVersion: batch/v1
kind: Job

metadata:
  name: signoz-migrator
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-clickhouse
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z clickhouse 9000; do
                echo "waiting for clickhouse..."
                sleep 2
              done

      containers:
        - name: migrate
          image: signoz/signoz-otel-collector:v0.144.2
          command: ["/signoz-otel-collector"]
          args: ["migrate", "sync", "up"]
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "9000"
            - name: CLICKHOUSE_USER
              value: admin
            - name: CLICKHOUSE_PASSWORD
              value: password
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
              value: "false"
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
              value: tcp://admin:password@clickhouse:9000
