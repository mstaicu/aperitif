apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel
  template:
    metadata:
      labels:
        app: otel
    spec:
      containers:
        - name: collector
          image: signoz/signoz-otel-collector:v0.144.2
          ports:
            - containerPort: 4317
            - containerPort: 4318
