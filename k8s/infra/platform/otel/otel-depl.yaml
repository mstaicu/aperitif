apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  otel-config.yaml: |
    extensions:
      health_check:

    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include:
          - /var/log/pods/*auth*/*/*.log
        start_at: end
        include_file_path: true

        operators:
          - type: container

          - type: json_parser
            parse_from: body
            on_error: send

          - type: move
            from: body.trace_id
            to: attributes.trace_id
            if: body.trace_id != nil

          - type: move
            from: body.span_id
            to: attributes.span_id
            if: body.span_id != nil

          - type: trace_parser
            trace_id:
              parse_from: attributes.trace_id
            span_id:
              parse_from: attributes.span_id

    processors:
      k8s_attributes:
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name

      transform/traefik:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(attributes, "entrypoint")
              - delete_key(attributes, "protocol")
              - delete_key(attributes, "tls_cipher")
              - delete_key(attributes, "tls_version")

      batch:

    exporters:
      debug:
        verbosity: detailed

    service:
      extensions:
        - health_check

      pipelines:

        traces:
          receivers:
            - otlp
          processors:
            - k8s_attributes
            - batch
          exporters:
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - k8s_attributes
            - transform/traefik
            - batch
          exporters:
            - debug

        logs:
          receivers:
            - filelog
          processors:
            - k8s_attributes
            - batch
          exporters:
            - debug

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
roleRef:
  kind: ClusterRole
  name: otel-collector
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - operator: Exists
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.147.0
          args:
            - --config=/conf/otel-config.yaml
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ports:
          #   - containerPort: 4317
          #     hostPort: 4317
          #   - containerPort: 4318
          #     hostPort: 4318

          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 200Mi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf

            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            - name: vardockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: otel-collector

        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: vardockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
