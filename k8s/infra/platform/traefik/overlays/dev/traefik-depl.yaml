apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik-depl
spec:
  selector:
    matchLabels:
      app: traefik
  replicas: 1
  template:
    spec:
      containers:
        - name: traefik
          args:
            - --entrypoints.http.address=:80
            - --entrypoints.https.address=:443
            #
            - --entrypoints.http.forwardedHeaders.insecure=true
            - --entrypoints.http.transport.respondingTimeouts.readTimeout=10s
            - --entrypoints.http.transport.respondingTimeouts.writeTimeout=10s
            - --entrypoints.http.transport.respondingTimeouts.idleTimeout=15s
            #
            - --entrypoints.https.forwardedHeaders.insecure=true
            - --entrypoints.https.transport.respondingTimeouts.readTimeout=10s
            - --entrypoints.https.transport.respondingTimeouts.writeTimeout=10s
            - --entrypoints.https.transport.respondingTimeouts.idleTimeout=15s
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-crd/#configuration-options
            - --providers.kubernetescrd=true
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#logs
            - --log.level=DEBUG
            - --accesslog=true
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/observability/healthcheck/ping/#ping
            - --ping=true
            - --ping.entryPoint=http
            #
            - --experimental.plugins.jwt.moduleName=github.com/traefik-plugins/traefik-jwt-plugin
            - --experimental.plugins.jwt.version=v0.10.0
            #
            # https://doc.traefik.io/traefik/operations/dashboard/
            - --api=true
            - --api.dashboard=true

            - --metrics.otlp=true
            - --metrics.otlp.serviceName=traefik
            - --metrics.otlp.grpc=true
            - --metrics.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT):4317
            - --metrics.otlp.grpc.insecure=true

            # Reduce cardinality
            - --metrics.otlp.addEntryPointsLabels=false
            - --metrics.otlp.addRoutersLabels=false
            - --metrics.otlp.addServicesLabels=false

            - --tracing.otlp=true
            - --tracing.serviceName=traefik
            - --tracing.otlp.grpc=true
            - --tracing.otlp.grpc.endpoint=$(OTEL_EXPORTER_OTLP_ENDPOINT):4317
            - --tracing.otlp.grpc.insecure=true

            - --tracing.sampleRate=1.0

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          volumeMounts:
            - name: plugins
              mountPath: /plugins-storage

      volumes:
        - name: plugins
          emptyDir: {}
