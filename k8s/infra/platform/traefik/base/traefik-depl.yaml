apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik-depl
spec:
  selector:
    matchLabels:
      app: traefik
  replicas: 1
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      terminationGracePeriodSeconds: 60
      containers:
        - name: traefik
          image: docker.io/traefik:v3.6.8
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https

          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      volumes:
        - name: tmp
          emptyDir: {}
