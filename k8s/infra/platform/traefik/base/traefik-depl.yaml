apiVersion: apps/v1
kind: Deployment

metadata:
  name: traefik-depl
spec:
  selector:
    matchLabels:
      app: traefik
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      terminationGracePeriodSeconds: 60
      containers:
        - name: traefik
          image: docker.io/traefik:v3.6.8
          args:
            # TODO: Keep both until we figure out if we do TLS termination
            # at the LB or at Traefik
            - --entrypoints.http.address=:80/tcp
            - --entrypoints.https.address=:443/tcp
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#configuration-options
            #
            # TRUST ONLY LB/WAF SOURCE RANGES
            - --entrypoints.http.forwardedHeaders.trustedIPs=<LB_OR_WAF_SOURCE_RANGES>
            - --entrypoints.https.forwardedHeaders.trustedIPs=<LB_OR_WAF_SOURCE_RANGES>
            #
            - --providers.kubernetescrd=true
            #
            # accept IngressRoutes that reference a Service that might not exist at deployment time (useful for zero-downtime deployments)
            #
            - --providers.kubernetescrd.allowEmptyServices=true
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#logs
            - --log.level=INFO
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#accesslogs
            - --accesslog=true
            #
            # https://doc.traefik.io/traefik/reference/install-configuration/observability/healthcheck/ping/#ping
            - --ping=true
            - --ping.entryPoint=http
            #
            #
            # Plugins
            #
            - --experimental.plugins.jwt.moduleName=github.com/traefik-plugins/traefik-jwt-plugin
            - --experimental.plugins.jwt.version=v0.10.0
            #
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https

          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: plugins
              mountPath: /plugins-storage

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: plugins
          emptyDir: {}
