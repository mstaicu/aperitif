#
# Encrypt:
#   sops encrypt --in-place "$FILE"
#
# Decrypt:
#   SOPS_AGE_KEY_FILE="$AGE_KEY" sops decrypt "$FILE"

# SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops decrypt domains/auth/workloads/api/infra/overlays/prod-eu/jwks.enc.json
