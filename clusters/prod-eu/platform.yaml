---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/cluster/ingress/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: event-bus
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/cluster/event-bus/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  # The NATS startup probe permits roughly 15 minutes of state recovery.
  timeout: 20m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/cluster/observability/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
