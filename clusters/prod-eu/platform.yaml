apiVersion: v1
kind: Namespace

metadata:
  name: traefik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: v1
kind: Namespace

metadata:
  name: nats
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: v1
kind: Namespace

metadata:
  name: otel
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

