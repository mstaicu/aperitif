apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: otel

resources:
  - ../../../../platform/observability/infra/overlays/production
  - openobserve.sops.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: openobserve
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: do-block-storage
