apiVersion: v1
kind: Namespace

metadata:
  name: nats
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: event-bus
  namespace: flux-system

spec:
  interval: 10m
  path: ./clusters/prod-eu/platform/event-bus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  # The NATS startup probe permits roughly 15 minutes of state recovery.
  timeout: 20m
