apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: accounts-migrations
  namespace: flux-system

spec:
  image: ghcr.io/mstaicu/accounts-migrations
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: accounts-migrations
  namespace: flux-system

spec:
  imageRepositoryRef:
    name: accounts-migrations
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: accounts-migrations
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/accounts/workloads/migrations/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: accounts-postgres
  images:
    - name: ghcr.io/mstaicu/accounts-migrations
      newTag: latest
      digest: sha256:4971ff9b1580a730b68c439d450071f094d8f20277d1c3fce4fd1413cfdcac22 # {"$imagepolicy": "flux-system:accounts-migrations:digest"}
  wait: true
  timeout: 5m
