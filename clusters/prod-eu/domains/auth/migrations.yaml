apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: auth-migrations
  namespace: flux-system

spec:
  image: ghcr.io/mstaicu/auth-migrations
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: auth-migrations
  namespace: flux-system

spec:
  imageRepositoryRef:
    name: auth-migrations
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: auth-migrations
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/auth/workloads/migrations/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: auth-postgres
  images:
    - name: ghcr.io/mstaicu/auth-migrations
      newTag: latest
      digest: sha256:026a705996cf65f40b7ff5281912e127ebfcb881e878c43c8ab430c9cba81d41 # {"$imagepolicy": "flux-system:auth-migrations:digest"}
  wait: true
  timeout: 5m
