apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-retention
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/identity/workloads/retention/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-migrations
  wait: true
  timeout: 5m
