apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../../../../domains/identity/workloads/api/infra/overlays/production
  - api-jwt.sops.yaml

configMapGenerator:
  - name: api-config
    literals:
      - ORIGIN=https://puuury.com
      - JWT_SIGNING_KID=k1

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: api
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: api.puuury.com
