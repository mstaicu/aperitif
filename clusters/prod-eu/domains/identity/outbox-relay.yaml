apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: identity-outbox-relay
  namespace: flux-system

spec:
  image: ghcr.io/mstaicu/outbox-relay
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: identity-outbox-relay
  namespace: flux-system

spec:
  imageRepositoryRef:
    name: identity-outbox-relay
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-outbox-relay
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/identity/workloads/outbox-relay/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-migrations
    - name: event-bus
  images:
    - name: ghcr.io/mstaicu/outbox-relay
      newTag: latest
      digest: "" # {"$imagepolicy": "flux-system:identity-outbox-relay:digest"}
  wait: true
  timeout: 5m
