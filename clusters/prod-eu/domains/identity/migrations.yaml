apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: identity-migrations
  namespace: flux-system

spec:
  image: ghcr.io/mstaicu/identity-migrations
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: identity-migrations
  namespace: flux-system

spec:
  imageRepositoryRef:
    name: identity-migrations
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-migrations
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/identity/workloads/migrations/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-postgres
  images:
    - name: ghcr.io/mstaicu/identity-migrations
      newTag: latest
      digest: "" # {"$imagepolicy": "flux-system:identity-migrations:digest"}
  wait: true
  timeout: 5m
