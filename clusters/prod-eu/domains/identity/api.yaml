apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository

metadata:
  name: identity-api
  namespace: flux-system

spec:
  image: ghcr.io/mstaicu/identity-api
  interval: 5m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy

metadata:
  name: identity-api
  namespace: flux-system

spec:
  imageRepositoryRef:
    name: identity-api
  filterTags:
    pattern: "^latest$"
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-api
  namespace: flux-system

spec:
  interval: 10m
  path: ./domains/identity/workloads/api/infra/overlays/prod-eu
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: identity-migrations
  images:
    - name: ghcr.io/mstaicu/identity-api
      newTag: latest
      digest: "" # {"$imagepolicy": "flux-system:identity-api:digest"}
  wait: true
  timeout: 5m
