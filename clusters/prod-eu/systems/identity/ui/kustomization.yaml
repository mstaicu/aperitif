apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../../../../systems/identity/infra/ui/overlays/production

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ui
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: puuury.com
