apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nats

resources:
  - ../../../../../systems/platform/infra/event-bus/overlays/production
  - nats-config.sops.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: nats
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: do-block-storage
