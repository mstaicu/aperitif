apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-cleanup
  namespace: flux-system

spec:
  interval: 10m
  path: ./systems/identity/cleanup/kustomize/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: identity-migrations
  wait: true
  timeout: 5m
