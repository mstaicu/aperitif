apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: identity-cleanup
  namespace: flux-system

spec:
  interval: 10m
  path: ./clusters/prod-eu-do/identity/cleanup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: identity-migrations
  wait: true
  timeout: 5m
