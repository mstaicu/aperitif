name: Publish relay image

on:
  push:
    branches: [master]
    paths:
      - "systems/platform/outbox-relay/**"

concurrency:
  group: publish-relay-image
  queue: max

permissions:
  contents: read

jobs:
  publish:
    name: Publish relay
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - id: image
        name: Read image reference
        env:
          COMPONENT: systems/platform/outbox-relay
        run: |
          image=""
          if [[ -f "$COMPONENT/skaffold.yaml" ]]; then
            image=$(yq -r '.build.artifacts[0].image // ""' "$COMPONENT/skaffold.yaml")
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: Build and push production image
        uses: docker/build-push-action@v7.3.0
        if: steps.image.outputs.name != ''
        with:
          context: systems/platform/outbox-relay
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Scan image digest
        uses: aquasecurity/trivy-action@v0.36.0
        if: steps.image.outputs.name != ''
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Tag scanned image as latest
        if: steps.image.outputs.name != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >
          docker buildx imagetools create
          --tag "$IMAGE:latest"
          "$IMAGE@$DIGEST"
