name: Check relay

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: relay-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check relay
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changes
        name: Find relay changes
        uses: tj-actions/changed-files@v47.0.6
        with:
          fail_on_initial_diff_error: true
          output_renamed_files_as_deleted_and_added: true

          files: |
            systems/platform/outbox-relay/**
            .github/workflows/relay-*.yaml

      - name: Set up Node 26.10.0
        if: steps.changes.outputs.any_modified != 'false'
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.10.0

      - name: Run package check
        if: steps.changes.outputs.any_modified != 'false'
        working-directory: systems/platform/outbox-relay
        run: |
          npm ci
          npm run check

      - name: Set up Buildx
        if: steps.changes.outputs.any_modified != 'false'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build production image
        if: steps.changes.outputs.any_modified != 'false'
        uses: docker/build-push-action@v7.3.0
        with:
          context: systems/platform/outbox-relay
          target: prod
          push: false
          provenance: false
          sbom: false
