name: Publish Identity images

on:
  push:
    branches: [master]
    paths:
      - "systems/identity/api/**"
      - "systems/identity/ui/**"
      - "systems/identity/migrations/**"
      - "!systems/identity/*/kustomize/**"

concurrency:
  group: publish-identity-images
  queue: max

permissions:
  contents: read

jobs:
  publish:
    name: Publish Identity (${{ matrix.package }})
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false

      matrix:
        package: [api, ui, migrations]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changes
        name: Find package changes
        uses: tj-actions/changed-files@v47.0.6
        with:
          fail_on_initial_diff_error: true
          output_renamed_files_as_deleted_and_added: true

          files: |
            systems/identity/${{ matrix.package }}/**
            .github/workflows/identity-publish.yaml
          files_ignore: systems/identity/${{ matrix.package }}/kustomize/**

      - id: image
        name: Read image reference
        if: steps.changes.outputs.any_modified != 'false'
        env:
          COMPONENT: systems/identity/${{ matrix.package }}
        run: |
          image=$(yq -er '.build.artifacts[0].image | select(. != "")' "$COMPONENT/skaffold.yaml")
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.changes.outputs.any_modified != 'false'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        if: steps.changes.outputs.any_modified != 'false'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: Build and push production image
        if: steps.changes.outputs.any_modified != 'false'
        uses: docker/build-push-action@v7.3.0
        with:
          context: systems/identity/${{ matrix.package }}
          target: prod
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Scan image digest
        if: steps.changes.outputs.any_modified != 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Tag scanned image as latest
        if: steps.changes.outputs.any_modified != 'false'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >
          docker buildx imagetools create
          --tag "$IMAGE:latest"
          "$IMAGE@$DIGEST"
