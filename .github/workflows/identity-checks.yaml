name: Check Identity

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: identity-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Check Identity (${{ matrix.package }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        package: [api, ui, contracts, migrations]

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changes
        name: Find Identity changes
        uses: tj-actions/changed-files@v47.0.6
        with:
          fail_on_initial_diff_error: true
          output_renamed_files_as_deleted_and_added: true

          files_yaml: |
            package:
              - systems/identity/${{ matrix.package }}/**
              - "!systems/identity/${{ matrix.package }}/kustomize/**"

            sql:
              - systems/identity/migrations/sql/**

      - name: Set up Node 26.10.0
        if: >-
          matrix.package != 'migrations' &&
          (
            steps.changes.outputs.package_any_modified != 'false' ||
            (
              matrix.package == 'api' &&
              steps.changes.outputs.sql_any_modified != 'false'
            )
          )
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.10.0

      - name: Run package check
        if: >-
          matrix.package != 'migrations' &&
          (
            steps.changes.outputs.package_any_modified != 'false' ||
            (
              matrix.package == 'api' &&
              steps.changes.outputs.sql_any_modified != 'false'
            )
          )
        working-directory: systems/identity/${{ matrix.package }}
        run: |
          npm ci
          npm run check

      - name: Set up Buildx
        if: matrix.package != 'contracts' && steps.changes.outputs.package_any_modified != 'false'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build production image
        if: matrix.package != 'contracts' && steps.changes.outputs.package_any_modified != 'false'
        uses: docker/build-push-action@v7.3.0
        with:
          context: systems/identity/${{ matrix.package }}
          target: prod
          push: false
          provenance: false
          sbom: false
