name: Check Identity

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: identity-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Find Identity components to check and build
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.any_changed }}
      build_paths: ${{ steps.images.outputs.all_changed_and_modified_files }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - id: changes
        name: Find Identity changes
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            systems/identity/**
            .github/workflows/identity-*.yaml
          fail_on_initial_diff_error: true

      - id: images
        name: Find changed Identity packages
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: systems/identity/*/**
          files_ignore: "**/infra/**"
          dir_names: true
          dir_names_max_depth: 3
          output_renamed_files_as_deleted_and_added: true
          fail_on_initial_diff_error: true
          matrix: true

  check:
    name: Check Identity
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Node 26.10.0
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.10.0

      - name: Run make check
        env:
          UNIT: systems/identity
        run: make -C "$UNIT" check

  build:
    name: Build ${{ matrix.path }}
    needs: changes
    if: needs.changes.outputs.build_paths != '[]'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.build_paths) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - id: image
        name: Read image reference
        env:
          COMPONENT: ${{ matrix.path }}
        run: |
          image=""
          if [[ -f "$COMPONENT/skaffold.yaml" ]]; then
            image=$(yq -r '.build.artifacts[0].image // ""' "$COMPONENT/skaffold.yaml")
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build production image
        uses: docker/build-push-action@v7.3.0
        if: steps.image.outputs.name != ''
        with:
          context: ${{ matrix.path }}
          target: prod
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
