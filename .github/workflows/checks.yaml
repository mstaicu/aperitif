name: Check

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: pull-request-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Find components to check and build
    runs-on: ubuntu-24.04
    outputs:
      check_paths: ${{ steps.changes.outputs.all_changed_and_modified_files }}
      build_paths: >-
        ${{ toJSON(fromJSON(format('[{0},{1}]',
          steps.domains.outputs.all_changed_and_modified_files,
          steps.runtimes.outputs.all_changed_and_modified_files
        )).*.*) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - id: changes
        name: Find changed components
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            domains/*/**
            platform/*/**
            clusters/*/**
          dir_names: true
          dir_names_max_depth: 2
          output_renamed_files_as_deleted_and_added: true
          fail_on_initial_diff_error: true
          matrix: true

      - id: domains
        name: Find changed domain components
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: domains/*/workloads/*/**
          files_ignore: "**/infra/**"
          dir_names: true
          dir_names_max_depth: 4
          output_renamed_files_as_deleted_and_added: true
          fail_on_initial_diff_error: true
          matrix: true

      - id: runtimes
        name: Find changed platform components
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: platform/runtime/*/**
          files_ignore: "**/infra/**"
          dir_names: true
          dir_names_max_depth: 3
          output_renamed_files_as_deleted_and_added: true
          fail_on_initial_diff_error: true
          matrix: true

  check:
    name: Check ${{ matrix.path }}
    needs: changes
    if: needs.changes.outputs.check_paths != '[]'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.check_paths) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - name: Set up Node 26.10.0
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.10.0

      - name: Run make check
        env:
          UNIT: ${{ matrix.path }}
        run: make -C "$UNIT" check

      - name: Set up Flux Schema
        if: startsWith(matrix.path, 'domains/')
        uses: fluxcd/flux2/action@v2.9.4
        with:
          version: 2.9.4
          plugins: schema@0.17.0

      - name: Validate domain workload manifests
        if: startsWith(matrix.path, 'domains/')
        working-directory: ${{ matrix.path }}
        run: flux schema validate workloads/*/infra/overlays/* --skip-json-path v1/Secret:/sops

  build:
    name: Build ${{ matrix.path }}
    needs: changes
    if: needs.changes.outputs.build_paths != '[]'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.changes.outputs.build_paths) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0

      - id: image
        name: Read image reference
        env:
          COMPONENT: ${{ matrix.path }}
        run: |
          image=""
          if [[ -f "$COMPONENT/skaffold.yaml" ]]; then
            image=$(yq -r '.build.artifacts[0].image // ""' "$COMPONENT/skaffold.yaml")
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build production image
        uses: docker/build-push-action@v7.3.0
        if: steps.image.outputs.name != ''
        with:
          context: ${{ matrix.path }}
          target: prod
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
