server_name: $HOSTNAME

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
  # Before going live, set max_file_store and max_memory_store to match the
  # available storage and memory, including headroom for stream replicas.
  # Without max_file_store, NATS derives its limit from free disk on startup.
}

# Without this, Kubernetes may kill a pod while it’s still leader,
# causing rougher elections and client disconnect pain.
lame_duck_duration: 30s
lame_duck_grace_period: 10s

pid_file: "/var/run/nats/nats.pid"

cluster {
  name: "LOCAL"
  port: 6222

  no_advertise: true

  routes = [
    "nats://nats-0.nats-headless:6222",
    "nats://nats-1.nats-headless:6222",
    "nats://nats-2.nats-headless:6222"
  ]
}

# SYS remains authenticated for system operations.
system_account: SYS
# Unauthenticated clients are mapped into the APP account.
no_auth_user: app

accounts: {
  SYS: {
    users: [
      { user: "sys", password: "changeit" }
    ]
  }

  APP: {
    jetstream: enabled

    users: [
      { user: "app" }
    ]
  }
}
