apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: traefik-controller
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
