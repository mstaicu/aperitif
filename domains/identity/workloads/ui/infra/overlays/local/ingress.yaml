apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ui
spec:
  rules:
    - http:
        paths:
          - path: /identity/login
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
          - path: /identity/signup
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
          - path: /identity/logout
            pathType: Exact
            backend:
              service:
                name: ui
                port:
                  number: 3000
          - path: /identity/assets
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
