apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: identity-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
