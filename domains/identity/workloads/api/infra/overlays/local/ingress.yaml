apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api
spec:
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3000
