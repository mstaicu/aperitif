apiVersion: batch/v1
kind: Job

metadata:
  name: migrations
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    spec:
      containers:
        - name: migrations
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: FLYWAY_URL
