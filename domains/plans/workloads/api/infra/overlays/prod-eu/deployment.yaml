apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/plans"
            - name: OTEL_SERVICE_NAME
              value: plans-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
