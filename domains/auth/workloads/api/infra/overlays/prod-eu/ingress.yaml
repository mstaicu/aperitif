apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api
spec:
  rules:
    - host: api.puuury.com
      http:
        paths:
          - path: /v1/passkeys
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /v1/session
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /v1/auth/docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
