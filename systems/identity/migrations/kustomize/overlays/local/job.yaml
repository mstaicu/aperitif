apiVersion: batch/v1
kind: Job

metadata:
  name: migrations

spec:
  template:
    spec:
      containers:
        - name: migrations
          image: docker.io/flyway/flyway:13.13.0-alpine
          args: ["migrate"]
          env:
            - name: FLYWAY_LOCATIONS
              value: filesystem:/db/sql
            - name: FLYWAY_FAIL_ON_MISSING_LOCATIONS
              value: "true"
          volumeMounts:
            - name: migration-sql
              mountPath: /db/sql

      volumes:
        - name: migration-sql
          configMap:
            name: migration-sql
