apiVersion: batch/v1
kind: Job

metadata:
  name: migrations

spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: migrations
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never

      containers:
        - name: migrations
          image: ghcr.io/mstaicu/identity-migrations
