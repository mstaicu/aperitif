apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../../base
  - database-secret.yaml
  - jwt-signing-keys-secret.yaml

patches:
  - path: deployment.yaml

configMapGenerator:
  - name: api-config
    literals:
      - ORIGIN=http://localhost:8080
      - JWT_SIGNING_KID=local-2026-09-30
