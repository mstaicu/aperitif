apiVersion: apps/v1
kind: Deployment

metadata:
  name: ui

spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false

      containers:
        - name: ui
          image: ghcr.io/mstaicu/identity-ui
          env:
            - name: PORT
              value: "3000"

          ports:
            - containerPort: 3000
              name: http
