apiVersion: skaffold/v4beta14
kind: Config

metadata:
  name: identity-ui

build:
  local:
    push: false

  artifacts:
    - image: ghcr.io/mstaicu/identity-ui
      context: .
      docker:
        dockerfile: Dockerfile
        target: dev

      sync:
        manual:
          - src: src/**/*
            dest: /home/node/app

manifests:
  kustomize:
    paths:
      - ../infra/ui/overlays/local

deploy:
  kubectl: {}
