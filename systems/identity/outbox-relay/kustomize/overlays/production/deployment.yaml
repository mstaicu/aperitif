apiVersion: apps/v1
kind: Deployment

metadata:
  name: outbox-relay

spec:
  template:
    spec:
      containers:
        - name: outbox-relay
          env:
            - name: NATS_URL
              value: nats://nats-client.nats:4222
            - name: OTEL_SERVICE_NAME
              value: identity-outbox-relay
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
