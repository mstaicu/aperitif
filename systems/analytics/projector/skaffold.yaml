apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: analytics-projector

build:
  local:
    push: false
  artifacts:
    - image: ghcr.io/mstaicu/analytics-projector
      context: .
      docker:
        dockerfile: Dockerfile
        target: prod

manifests:
  kustomize:
    paths:
      - ../infra/projector/overlays/local
deploy:
  kubectl: {}
