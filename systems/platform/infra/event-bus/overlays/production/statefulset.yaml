apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats

spec:
  template:
    spec:
      volumes:
        - name: config
          configMap: null
          secret:
            secretName: nats-config

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nats
              topologyKey: kubernetes.io/hostname

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
