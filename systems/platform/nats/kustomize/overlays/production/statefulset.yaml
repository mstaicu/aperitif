apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: nats

spec:
  template:
    spec:
      containers:
        - name: nats
          env:
            - name: NATS_SYS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: NATS_SYS_PASSWORD

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nats
              topologyKey: kubernetes.io/hostname

  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
