    literals:
      - OTEL_EXPORTER_OTLP_AUTHORIZATION=YWRtaW5AZXhhbXBsZS5jb206TG9jYWwtMjc2YzdmNjk2ZGMzNThjOWQwMDIzMWE5LUFhMSE=

patches:
  - path: agent-daemonset.yaml
